<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="1">{% endif %}
<title>{% block title %}Служба качества{% endblock %} · Агент по регламентам</title>
<style>
:root{--fg:#1b1b1b;--muted:#666;--line:#d8d8d8;--accent:#1f5fbf;--ok:#1b7a3d;--bad:#b00020;--bg:#fafafa}
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;color:var(--fg);background:var(--bg);margin:0}
header{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:24px;align-items:center;height:52px}
header b{margin-right:8px}header a{color:var(--fg);text-decoration:none;padding:16px 0;border-bottom:2px solid transparent}
header a.on{border-color:var(--accent);color:var(--accent)}header .off{color:#aaa;cursor:not-allowed}
header .sp{margin-left:auto;color:var(--muted);font-size:14px}
main{max-width:1060px;margin:24px auto;padding:0 24px}h1{font-size:24px;margin:0 0 16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{background:#f1f3f6;font-weight:600}
.btn,button{font:inherit;display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none}
.btn.sec,button.sec{background:#fff;color:var(--fg);border:1px solid var(--line)}
form.f label{display:block;margin:14px 0 4px;font-weight:600}form.f input[type=text],form.f select,form.f input[type=file]{width:100%;padding:8px;font:inherit}
form.f .row label{display:inline;font-weight:400;margin-right:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.warn{color:#8a5a00}.err{color:var(--bad)}.ok{color:var(--ok)}.muted{color:var(--muted)}
.steps{list-style:none;padding:0;margin:0}.steps li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.steps .m{width:22px;text-align:center}.steps .s{margin-left:auto;color:var(--muted)}
.todo{color:#aaa}.active{font-weight:600}
progress{width:220px;vertical-align:middle}
details{margin:4px 0 4px 16px}summary{cursor:pointer}.pt{margin:2px 0 2px 32px;font-size:14px}
.ready{font-size:20px;color:var(--ok);font-weight:600}
</style></head><body>
<header><b>Служба качества</b>
<a href="/admin/documents" class="on">Документы</a>
<span class="off" title="Скоро">Обращения</span><span class="off" title="Скоро">FAQ</span><span class="off" title="Скоро">Аналитика</span>
<span class="sp">{% if identity %}{{ identity.email }} · <a href="/start">сменить роль</a>{% endif %}</span></header>
<main>{% block content %}{% endblock %}</main></body></html>
