[project]
name = "reglament-agent"
version = "0.1.0"
description = "Агент поиска ответов по регламентам"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "chainlit>=2.12.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pgserver>=0.1.4",
    "aiosmtpd>=1.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reglament_agent"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "reglament_agent/storage/migrations"
"docx/glossary.tsv" = "reglament_agent/dialog/glossary.tsv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
