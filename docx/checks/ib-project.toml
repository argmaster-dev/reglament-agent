# Проверочные вопросы службы качества; составлены по тексту регламента.
# Вопросы прогоняются через агента кнопкой «Проверить» (Документы → Проверка вопросов).
# point — номер пункта, на который агент должен сослаться; outcome — ожидаемый исход ответа;
# phrase — фраза, которая должна быть в тексте найденного пункта (необязательно);
# department — подразделение, под которым задаётся вопрос (чтобы агент не переспрашивал).

doc_id = "ib-project"
department = "Дирекция ИБ"

[[question]]
question = "Я из Дирекции ИБ. Через сколько дней без ответа от SS карточку проекта отклоняют?"
point = "2.3"
outcome = "answer"
phrase = "5 рабочих дней"

[[question]]
question = "Дирекция ИБ: в какой срок координатор назначает РП, если информация полная?"
point = "2.7"
outcome = "answer"
phrase = "в течение 1 рабочего дня"

[[question]]
question = "Я в Дирекции ИБ. Когда менеджер поддержки продаж должен создать заказ покупателя после подписания договора?"
point = "10.1"
outcome = "answer"
phrase = "не позднее 3 рабочих дней"

[[question]]
question = "Дирекция ИБ: за сколько времени РП должен создать и согласовать смету?"
point = "11.1"
outcome = "answer"
phrase = "в течение 3 рабочих дней"

[[question]]
question = "Я из Дирекции ИБ. Что делать РП, если за 5 рабочих дней с начала работ он не предоставил данные для заключения ФС?"
point = "12.8"
outcome = "answer"
phrase = "уведомить Менеджера бэк-офиса"
