# Проверочные вопросы службы качества; составлены по тексту регламента.
# Вопросы прогоняются через агента кнопкой «Проверить» (Документы → Проверка вопросов).
# point — номер пункта, на который агент должен сослаться; outcome — ожидаемый исход ответа;
# phrase — фраза, которая должна быть в тексте найденного пункта (необязательно);
# department — подразделение, под которым задаётся вопрос (чтобы агент не переспрашивал).

doc_id = "ib-presale"
department = "Дирекция ИБ"

[[question]]
question = "Я из Дирекции ИБ, пресейл. За какое время пресейл-архитектор обязан взять заявку в работу?"
point = "5.1"
outcome = "answer"
phrase = "в течение 1 рабочего дня"

[[question]]
question = "Дирекция ИБ, пресейл: что делает SS, если в запросе есть темы других центров компетенции?"
point = "6.6"
outcome = "answer"
phrase = "комплексного"

[[question]]
question = "Я из Дирекции ИБ на пресейле. За какой срок ресурс-менеджеры дают предварительную оценку доступности ресурсов?"
point = "7.8"
outcome = "answer"
phrase = "в течение 1 рабочего дня"

[[question]]
question = "Дирекция ИБ, пресейл: что можно сделать, если ресурс-менеджер не ответил в срок?"
point = "7.9"
outcome = "answer"
phrase = "линейного руководителя"

[[question]]
question = "Я из Дирекции ИБ, пресейл. Что делать SS, если клиент полгода не принимал решение о покупке по расчёту?"
point = "8.3"
outcome = "answer"
phrase = "6 месяцев"
