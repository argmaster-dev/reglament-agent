# Проверочные вопросы службы качества; составлены по тексту регламента.
# Вопросы прогоняются через агента кнопкой «Проверить» (Документы → Проверка вопросов).
# point — номер пункта, на который агент должен сослаться; outcome — ожидаемый исход ответа;
# phrase — фраза, которая должна быть в тексте найденного пункта (необязательно);
# department — подразделение, под которым задаётся вопрос (чтобы агент не переспрашивал).

doc_id = "dbrct-project"
department = "ДБРЦТ"

[[question]]
question = "Я из ДБРЦТ. За сколько рабочих дней до отправки предложения заказчику нужно подать заявку на пресейл?"
point = "1.5"
outcome = "answer"
phrase = "3 рабочих дня"

[[question]]
question = "Я работаю в ДБРЦТ. Какие рекомендуемые сроки выдачи точной оценки при пресейле?"
point = "1.6"
outcome = "answer"
phrase = "5 рабочих дней"

[[question]]
question = "В ДБРЦТ можно ли подать бюджетную оценку в конкурс?"
point = "2.4"
outcome = "answer"
phrase = "не может использоваться для подачи в конкурс"

[[question]]
question = "Я в ДБРЦТ: за какое время назначают руководителя проекта после запроса на инициацию?"
point = "7.2"
outcome = "answer"
phrase = "12 рабочих часов"

[[question]]
question = "В ДБРЦТ можно ли начинать работы по проекту, пока не подписан договор?"
point = "8.4"
outcome = "answer"
phrase = "запрещены"

[[question]]
question = "ДБРЦТ: в какой срок РП заводит смету после подписания договора?"
point = "10.2"
outcome = "answer"
phrase = "в течение 3 рабочих дней"
