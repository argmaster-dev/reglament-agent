# Проверочные вопросы службы качества; составлены по тексту регламента.
# Вопросы прогоняются через агента кнопкой «Проверить» (Документы → Проверка вопросов).
# point — номер пункта, на который агент должен сослаться; outcome — ожидаемый исход ответа;
# phrase — фраза, которая должна быть в тексте найденного пункта (необязательно);
# department — подразделение, под которым задаётся вопрос (чтобы агент не переспрашивал).

doc_id = "td-project"
department = "Техническая дирекция"

[[question]]
question = "Я из Технической дирекции. За какой срок назначают руководителя проекта?"
point = "9.1"
outcome = "answer"
phrase = "1 рабочий день"

[[question]]
question = "Техническая дирекция: как быстро назначается архитектор проекта?"
point = "10.3"
outcome = "answer"
phrase = "1 рабочий день"

[[question]]
question = "Я в Технической дирекции. Сколько потенциальных подрядчиков должен запросить TPS?"
point = "2.12"
outcome = "answer"
phrase = "не менее 3-х"

[[question]]
question = "В Технической дирекции можно ли использовать бюджетную оценку для контрактования?"
point = "2.4"
outcome = "answer"
phrase = "не может использоваться для подачи в конкурс, контрактования"

[[question]]
question = "Я из Технической дирекции. Что обязана сделать дирекция после выдачи согласованного расчёта?"
point = "2.3"
outcome = "answer"
phrase = "реализовать проект за указанную себестоимость"
