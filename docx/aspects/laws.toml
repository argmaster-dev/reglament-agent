# Проверенные статьи (КонсультантПлюс, актуальная редакция на 27.11.2026). Тексты сохранены дословно, служебные строки сайта убраны.

[[law]]
id = "gk-432"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть первая)"
number = "51-ФЗ"
article = "Статья 432"
title = "Основные положения о заключении договора"
text = """1. Договор считается заключенным, если между сторонами, в требуемой в подлежащих случаях форме, достигнуто соглашение по всем существенным условиям договора.
Существенными являются условия о предмете договора, условия, которые названы в законе или иных правовых актах как существенные или необходимые для договоров данного вида, а также все те условия, относительно которых по заявлению одной из сторон должно быть достигнуто соглашение.
2. Договор заключается посредством направления оферты (предложения заключить договор) одной из сторон и ее акцепта (принятия предложения) другой стороной.
3. Сторона, принявшая от другой стороны полное или частичное исполнение по договору либо иным образом подтвердившая действие договора, не вправе требовать признания этого договора незаключенным, если заявление такого требования с учетом конкретных обстоятельств будет противоречить принципу добросовестности (пункт 3 статьи 1).
(п. 3 введен Федеральным законом от 08.03.2015 N 42-ФЗ)"""
revision = "ред. от 10.06.2026, с изм. от 22.10.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_5142/adbefccc8d538d42038164bb81d886c76e719d63/"
retrieved = "2026-11-27"

[[law]]
id = "gk-435"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть первая)"
number = "51-ФЗ"
article = "Статья 435"
title = "Оферта"
text = """1. Офертой признается адресованное одному или нескольким конкретным лицам предложение, которое достаточно определенно и выражает намерение лица, сделавшего предложение, считать себя заключившим договор с адресатом, которым будет принято предложение.
Оферта должна содержать существенные условия договора.
2. Оферта связывает направившее ее лицо с момента ее получения адресатом.
Если извещение об отзыве оферты поступило ранее или одновременно с самой офертой, оферта считается не полученной."""
revision = "ред. от 10.06.2026, с изм. от 22.10.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_5142/892c4b89172aef07157d5d6c0e5dcde6e37b3a83/"
retrieved = "2026-11-27"

[[law]]
id = "gk-437"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть первая)"
number = "51-ФЗ"
article = "Статья 437"
title = "Приглашение делать оферты. Публичная оферта"
text = """1. Реклама и иные предложения, адресованные неопределенному кругу лиц, рассматриваются как приглашение делать оферты, если иное прямо не указано в предложении.
2. Содержащее все существенные условия договора предложение, из которого усматривается воля лица, делающего предложение, заключить договор на указанных в предложении условиях с любым, кто отзовется, признается офертой (публичная оферта)."""
revision = "ред. от 10.06.2026, с изм. от 22.10.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_5142/1a77b2ec302d6a384a228dff59e53680ccffaaca/"
retrieved = "2026-11-27"

[[law]]
id = "gk-395"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть первая)"
number = "51-ФЗ"
article = "Статья 395"
title = "Ответственность за неисполнение денежного обязательства"
text = """1. В случаях неправомерного удержания денежных средств, уклонения от их возврата, иной просрочки в их уплате подлежат уплате проценты на сумму долга. Размер процентов определяется ключевой ставкой Банка России, действовавшей в соответствующие периоды. Эти правила применяются, если иной размер процентов не установлен законом или договором.
(п. 1 в ред. Федерального закона от 03.07.2016 N 315-ФЗ)
2. Если убытки, причиненные кредитору неправомерным пользованием его денежными средствами, превышают сумму процентов, причитающуюся ему на основании пункта 1 настоящей статьи, он вправе требовать от должника возмещения убытков в части, превышающей эту сумму.
3. Проценты за пользование чужими средствами взимаются по день уплаты суммы этих средств кредитору, если законом, иными правовыми актами или договором не установлен для начисления процентов более короткий срок.
4. В случае, когда соглашением сторон предусмотрена неустойка за неисполнение или ненадлежащее исполнение денежного обязательства, предусмотренные настоящей статьей проценты не подлежат взысканию, если иное не предусмотрено законом или договором.
(п. 4 введен Федеральным законом от 08.03.2015 N 42-ФЗ)
5. Начисление процентов на проценты (сложные проценты) не допускается, если иное не установлено законом. По обязательствам, исполняемым при осуществлении сторонами предпринимательской деятельности, применение сложных процентов не допускается, если иное не предусмотрено законом или договором.
(п. 5 введен Федеральным законом от 08.03.2015 N 42-ФЗ)
6. Если подлежащая уплате сумма процентов явно несоразмерна последствиям нарушения обязательства, суд по заявлению должника вправе уменьшить предусмотренные договором проценты, но не менее чем до суммы, определенной исходя из ставки, указанной в пункте 1 настоящей статьи.
(п. 6 введен Федеральным законом от 08.03.2015 N 42-ФЗ)"""
revision = "ред. от 10.06.2026, с изм. от 22.10.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_5142/93383099dc4f06165d8d4aac4eeb159db4f6da3d/"
retrieved = "2026-11-27"

[[law]]
id = "gk-450"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть первая)"
number = "51-ФЗ"
article = "Статья 450"
title = "Основания изменения и расторжения договора"
text = """1. Изменение и расторжение договора возможны по соглашению сторон, если иное не предусмотрено настоящим Кодексом, другими законами или договором.
Многосторонним договором, исполнение которого связано с осуществлением всеми его сторонами предпринимательской деятельности, может быть предусмотрена возможность изменения или расторжения такого договора по соглашению как всех, так и большинства лиц, участвующих в указанном договоре, если иное не установлено законом. В указанном в настоящем абзаце договоре может быть предусмотрен порядок определения такого большинства.
(абзац введен Федеральным законом от 08.03.2015 N 42-ФЗ)
2. По требованию одной из сторон договор может быть изменен или расторгнут по решению суда только:
1) при существенном нарушении договора другой стороной;
2) в иных случаях, предусмотренных настоящим Кодексом, другими законами или договором.
Существенным признается нарушение договора одной из сторон, которое влечет для другой стороны такой ущерб, что она в значительной степени лишается того, на что была вправе рассчитывать при заключении договора.
3. Утратил силу с 1 июня 2015 года. - Федеральный закон от 08.03.2015 N 42-ФЗ.
4. Сторона, которой настоящим Кодексом, другими законами или договором предоставлено право на одностороннее изменение договора, должна при осуществлении этого права действовать добросовестно и разумно в пределах, предусмотренных настоящим Кодексом, другими законами или договором.
(п. 4 введен Федеральным законом от 08.03.2015 N 42-ФЗ)"""
revision = "ред. от 10.06.2026, с изм. от 22.10.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_5142/c231822b9f355b8c760b3389e80269f0d987870e/"
retrieved = "2026-11-27"

[[law]]
id = "gk-452"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть первая)"
number = "51-ФЗ"
article = "Статья 452"
title = "Порядок изменения и расторжения договора"
text = """1. Соглашение об изменении или о расторжении договора совершается в той же форме, что и договор, если из закона, иных правовых актов, договора или обычаев не вытекает иное.
(в ред. Федерального закона от 08.03.2015 N 42-ФЗ)
2. Требование об изменении или о расторжении договора может быть заявлено стороной в суд только после получения отказа другой стороны на предложение изменить или расторгнуть договор либо неполучения ответа в срок, указанный в предложении или установленный законом либо договором, а при его отсутствии - в тридцатидневный срок."""
revision = "ред. от 10.06.2026, с изм. от 22.10.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_5142/ca10f0c19da23330c9d92dacb11df0c92444bca3/"
retrieved = "2026-11-27"

[[law]]
id = "gk-506"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 506"
title = "Договор поставки"
text = """По договору поставки поставщик-продавец, осуществляющий предпринимательскую деятельность, обязуется передать в обусловленный срок или сроки производимые или закупаемые им товары покупателю для использования в предпринимательской деятельности или в иных целях, не связанных с личным, семейным, домашним и иным подобным использованием."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/f84987de733d13299eccd0532f4a45b13509548f/"
retrieved = "2026-11-27"

[[law]]
id = "gk-702"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 702"
title = "Договор подряда"
text = """1. По договору подряда одна сторона (подрядчик) обязуется выполнить по заданию другой стороны (заказчика) определенную работу и сдать ее результат заказчику, а заказчик обязуется принять результат работы и оплатить его.
2. К отдельным видам договора подряда (бытовой подряд, строительный подряд, подряд на выполнение проектных и изыскательских работ, подрядные работы для государственных нужд) положения, предусмотренные настоящим параграфом, применяются, если иное не установлено правилами настоящего Кодекса об этих видах договоров."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/416441e14a600610e2ba0765f72cb72c290cdc3c/"
retrieved = "2026-11-27"

[[law]]
id = "gk-706"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 706"
title = "Генеральный подрядчик и субподрядчик"
text = """1. Если из закона или договора подряда не вытекает обязанность подрядчика выполнить предусмотренную в договоре работу лично, подрядчик вправе привлечь к исполнению своих обязательств других лиц (субподрядчиков). В этом случае подрядчик выступает в роли генерального подрядчика.
2. Подрядчик, который привлек к исполнению договора подряда субподрядчика в нарушение положений пункта 1 настоящей статьи или договора, несет перед заказчиком ответственность за убытки, причиненные участием субподрядчика в исполнении договора.
3. Генеральный подрядчик несет перед заказчиком ответственность за последствия неисполнения или ненадлежащего исполнения обязательств субподрядчиком в соответствии с правилами пункта 1 статьи 313 и статьи 403 настоящего Кодекса, а перед субподрядчиком - ответственность за неисполнение или ненадлежащее исполнение заказчиком обязательств по договору подряда.
Если иное не предусмотрено законом или договором, заказчик и субподрядчик не вправе предъявлять друг другу требования, связанные с нарушением договоров, заключенных каждым из них с генеральным подрядчиком.
4. С согласия генерального подрядчика заказчик вправе заключить договоры на выполнение отдельных работ с другими лицами. В этом случае указанные лица несут ответственность за неисполнение или ненадлежащее исполнение работы непосредственно перед заказчиком."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/dae08bc5ec696109c1e4d943d3e6a45896e1f1ac/"
retrieved = "2026-11-27"

[[law]]
id = "gk-711"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 711"
title = "Порядок оплаты работы"
text = """1. Если договором подряда не предусмотрена предварительная оплата выполненной работы или отдельных ее этапов, заказчик обязан уплатить подрядчику обусловленную цену после окончательной сдачи результатов работы при условии, что работа выполнена надлежащим образом и в согласованный срок, либо с согласия заказчика досрочно.
2. Подрядчик вправе требовать выплаты ему аванса либо задатка только в случаях и в размере, указанных в законе или договоре подряда."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/46561f5271883fcf47f3e9859d3a59eb56bfcd96/"
retrieved = "2026-11-27"

[[law]]
id = "gk-716"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 716"
title = "Обстоятельства, о которых подрядчик обязан предупредить заказчика"
text = """1. Подрядчик обязан немедленно предупредить заказчика и до получения от него указаний приостановить работу при обнаружении:
непригодности или недоброкачественности предоставленных заказчиком материала, оборудования, технической документации или переданной для переработки (обработки) вещи;
возможных неблагоприятных для заказчика последствий выполнения его указаний о способе исполнения работы;
иных не зависящих от подрядчика обстоятельств, которые грозят годности или прочности результатов выполняемой работы либо создают невозможность ее завершения в срок.
2. Подрядчик, не предупредивший заказчика об обстоятельствах, указанных в пункте 1 настоящей статьи, либо продолживший работу, не дожидаясь истечения указанного в договоре срока, а при его отсутствии разумного срока для ответа на предупреждение или несмотря на своевременное указание заказчика о прекращении работы, не вправе при предъявлении к нему или им к заказчику соответствующих требований ссылаться на указанные обстоятельства.
3. Если заказчик, несмотря на своевременное и обоснованное предупреждение со стороны подрядчика об обстоятельствах, указанных в пункте 1 настоящей статьи, в разумный срок не заменит непригодные или недоброкачественные материал, оборудование, техническую документацию или переданную для переработки (обработки) вещь, не изменит указаний о способе выполнения работы или не примет других необходимых мер для устранения обстоятельств, грозящих ее годности, подрядчик вправе отказаться от исполнения договора подряда и потребовать возмещения причиненных его прекращением убытков."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/0a0cc8dfd273d410f517bdd9e782b401d8b1db57/"
retrieved = "2026-11-27"

[[law]]
id = "gk-720"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 720"
title = "Приемка заказчиком работы, выполненной подрядчиком"
text = """1. Заказчик обязан в сроки и в порядке, которые предусмотрены договором подряда, с участием подрядчика осмотреть и принять выполненную работу (ее результат), а при обнаружении отступлений от договора, ухудшающих результат работы, или иных недостатков в работе немедленно заявить об этом подрядчику.
2. Заказчик, обнаруживший недостатки в работе при ее приемке, вправе ссылаться на них в случаях, если в акте либо в ином документе, удостоверяющем приемку, были оговорены эти недостатки либо возможность последующего предъявления требования об их устранении.
3. Если иное не предусмотрено договором подряда, заказчик, принявший работу без проверки, лишается права ссылаться на недостатки работы, которые могли быть установлены при обычном способе ее приемки (явные недостатки).
4. Заказчик, обнаруживший после приемки работы отступления в ней от договора подряда или иные недостатки, которые не могли быть установлены при обычном способе приемки (скрытые недостатки), в том числе такие, которые были умышленно скрыты подрядчиком, обязан известить об этом подрядчика в разумный срок по их обнаружении.
5. При возникновении между заказчиком и подрядчиком спора по поводу недостатков выполненной работы или их причин по требованию любой из сторон должна быть назначена экспертиза. Расходы на экспертизу несет подрядчик, за исключением случаев, когда экспертизой установлено отсутствие нарушений подрядчиком договора подряда или причинной связи между действиями подрядчика и обнаруженными недостатками. В указанных случаях расходы на экспертизу несет сторона, потребовавшая назначения экспертизы, а если она назначена по соглашению между сторонами, обе стороны поровну.
6. Если иное не предусмотрено договором подряда, при уклонении заказчика от принятия выполненной работы подрядчик вправе по истечении месяца со дня, когда согласно договору результат работы должен был быть передан заказчику, и при условии последующего двукратного предупреждения заказчика продать результат работы, а вырученную сумму, за вычетом всех причитающихся подрядчику платежей, внести на имя заказчика в депозит в порядке, предусмотренном статьей 327 настоящего Кодекса.
7. Если уклонение заказчика от принятия выполненной работы повлекло за собой просрочку в сдаче работы, риск случайной гибели изготовленной (переработанной или обработанной) вещи признается перешедшим к заказчику в момент, когда передача вещи должна была состояться."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/48e02faf6357243a0fa7806dd7ca2dc2493301a8/"
retrieved = "2026-11-27"

[[law]]
id = "gk-779"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть вторая)"
number = "14-ФЗ"
article = "Статья 779"
title = "Договор возмездного оказания услуг"
text = """1. По договору возмездного оказания услуг исполнитель обязуется по заданию заказчика оказать услуги (совершить определенные действия или осуществить определенную деятельность), а заказчик обязуется оплатить эти услуги.
2. Правила настоящей главы применяются к договорам оказания услуг связи, медицинских, ветеринарных, аудиторских, консультационных, информационных услуг, услуг по обучению, туристическому обслуживанию и иных, за исключением услуг, оказываемых по договорам, предусмотренным главами 37, 38, 40, 41, 44, 45, 46, 47, 49, 51, 53 настоящего Кодекса."""
revision = "ред. от 24.06.2025, с изм. от 09.06.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_9027/a397ec4ca2dd0c96c211ee4e4436628f0cf581a3/"
retrieved = "2026-11-27"

[[law]]
id = "gk-1235"
short = "ГК РФ"
act = "Гражданский кодекс Российской Федерации (часть четвертая)"
number = "230-ФЗ"
article = "Статья 1235"
title = "Лицензионный договор"
text = """1. По лицензионному договору одна сторона - обладатель исключительного права на результат интеллектуальной деятельности или на средство индивидуализации (лицензиар) предоставляет или обязуется предоставить другой стороне (лицензиату) право использования такого результата или такого средства в предусмотренных договором пределах.
Лицензиат может использовать результат интеллектуальной деятельности или средство индивидуализации только в пределах тех прав и теми способами, которые предусмотрены лицензионным договором. Право использования результата интеллектуальной деятельности или средства индивидуализации, прямо не указанное в лицензионном договоре, не считается предоставленным лицензиату.
2. Лицензионный договор заключается в письменной форме, если настоящим Кодексом не предусмотрено иное. Несоблюдение письменной формы влечет недействительность лицензионного договора.
Предоставление права использования результата интеллектуальной деятельности или средства индивидуализации по лицензионному договору подлежит государственной регистрации в случаях и в порядке, которые предусмотрены статьей 1232 настоящего Кодекса.
(п. 2 в ред. Федерального закона от 12.03.2014 N 35-ФЗ)
3. В лицензионном договоре должна быть указана территория, на которой допускается использование результата интеллектуальной деятельности или средства индивидуализации. Если территория, на которой допускается использование такого результата или такого средства, в договоре не указана, лицензиат вправе осуществлять их использование на всей территории Российской Федерации.
4. Срок, на который заключается лицензионный договор, не может превышать срок действия исключительного права на результат интеллектуальной деятельности или на средство индивидуализации.
В случае, когда в лицензионном договоре срок его действия не определен, договор считается заключенным на пять лет, если настоящим Кодексом не предусмотрено иное.
В случае прекращения исключительного права лицензионный договор прекращается.
5. По лицензионному договору лицензиат обязуется уплатить лицензиару обусловленное договором вознаграждение, если договором не предусмотрено иное.
При отсутствии в возмездном лицензионном договоре условия о размере вознаграждения или порядке его определения договор считается незаключенным. При этом правила определения цены, предусмотренные пунктом 3 статьи 424 настоящего Кодекса, не применяются.
Выплата вознаграждения по лицензионному договору может быть предусмотрена в форме фиксированных разовых или периодических платежей, процентных отчислений от дохода (выручки) либо в иной форме.
(абзац введен Федеральным законом от 12.03.2014 N 35-ФЗ)
5.1. Не допускается безвозмездное предоставление права использования результата интеллектуальной деятельности или средства индивидуализации в отношениях между коммерческими организациями на территории всего мира и на весь срок действия исключительного права на условиях исключительной лицензии, если настоящим Кодексом не установлено иное.
(п. 5.1 введен Федеральным законом от 12.03.2014 N 35-ФЗ)
6. Лицензионный договор должен предусматривать:
1) предмет договора путем указания на результат интеллектуальной деятельности или на средство индивидуализации, право использования которых предоставляется по договору, с указанием в соответствующих случаях номера документа, удостоверяющего исключительное право на такой результат или на такое средство (патент, свидетельство);
(в ред. Федерального закона от 12.03.2014 N 35-ФЗ)
2) способы использования результата интеллектуальной деятельности или средства индивидуализации.
7. Переход исключительного права на результат интеллектуальной деятельности или на средство индивидуализации к новому правообладателю не является основанием для изменения или расторжения лицензионного договора, заключенного предшествующим правообладателем."""
revision = "ред. от 23.07.2025 (с изм. и доп., вступ. в силу с 04.01.2026)"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_64629/640cbca01ece35bc535ffe5e6d96b7988d2daf6b/"
retrieved = "2026-11-27"

[[law]]
id = "nk-54-1"
short = "НК РФ"
act = "Налоговый кодекс Российской Федерации (часть первая)"
number = "146-ФЗ"
article = "Статья 54.1"
title = "Пределы осуществления прав по исчислению налоговой базы и (или) суммы налога, сбора, страховых взносов"
text = """(введена Федеральным законом от 18.07.2017 N 163-ФЗ)
1. Не допускается уменьшение налогоплательщиком налоговой базы и (или) суммы подлежащего уплате налога в результате искажения сведений о фактах хозяйственной жизни (совокупности таких фактов), об объектах налогообложения, подлежащих отражению в налоговом и (или) бухгалтерском учете либо налоговой отчетности налогоплательщика.
2. При отсутствии обстоятельств, предусмотренных пунктом 1 настоящей статьи, по имевшим место сделкам (операциям) налогоплательщик вправе уменьшить налоговую базу и (или) сумму подлежащего уплате налога в соответствии с правилами соответствующей главы части второй настоящего Кодекса при соблюдении одновременно следующих условий:
1) основной целью совершения сделки (операции) не являются неуплата (неполная уплата) и (или) зачет (возврат) суммы налога;
2) обязательство по сделке (операции) исполнено лицом, являющимся стороной договора, заключенного с налогоплательщиком, и (или) лицом, которому обязательство по исполнению сделки (операции) передано по договору или закону.
3. В целях пунктов 1 и 2 настоящей статьи подписание первичных учетных документов неустановленным или неуполномоченным лицом, нарушение контрагентом налогоплательщика законодательства о налогах и сборах, наличие возможности получения налогоплательщиком того же результата экономической деятельности при совершении иных не запрещенных законодательством сделок (операций) не могут рассматриваться в качестве самостоятельного основания для признания уменьшения налогоплательщиком налоговой базы и (или) суммы подлежащего уплате налога неправомерным.
4. Положения, предусмотренные настоящей статьей, также применяются в отношении сборов и страховых взносов и распространяются на плательщиков сборов, плательщиков страховых взносов и налоговых агентов."""
revision = "ред. от 04.08.2026 (с изм. и доп., вступ. в силу с 01.10.2026)"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_19671/456468126824fd90201c25b3613aed69768da607/"
retrieved = "2026-11-27"

[[law]]
id = "nk-169"
short = "НК РФ"
act = "Налоговый кодекс Российской Федерации (часть вторая)"
number = "117-ФЗ"
article = "Статья 169"
title = "Счет-фактура"
text = """1. Счет-фактура является документом, служащим основанием для принятия покупателем предъявленных продавцом товаров (работ, услуг), имущественных прав (включая комиссионера, агента, которые осуществляют реализацию товаров (работ, услуг), имущественных прав от своего имени) сумм налога к вычету в порядке, предусмотренном настоящей главой.
(в ред. Федерального закона от 22.07.2005 N 119-ФЗ)
Счет-фактура может быть составлен и выставлен на бумажном носителе и (или) в электронной форме. Счета-фактуры составляются в электронной форме по взаимному согласию сторон сделки и при наличии у указанных сторон совместимых технических средств и возможностей для приема и обработки этих счетов-фактур, если иное не предусмотрено настоящей статьей, в соответствии с установленными форматами и порядком.
(абзац введен Федеральным законом от 27.07.2010 N 229-ФЗ, в ред. Федеральных законов от 29.06.2012 N 97-ФЗ, от 09.11.2020 N 371-ФЗ)
Корректировочный счет-фактура, выставленный продавцом покупателю товаров (работ, услуг), имущественных прав при изменении стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав в сторону уменьшения, в том числе в случае уменьшения цены (тарифа) и (или) уменьшения количества (объема) отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, является документом, служащим основанием для принятия продавцом товаров (работ, услуг), имущественных прав сумм налога к вычету в порядке, предусмотренном настоящей главой.
(абзац введен Федеральным законом от 19.07.2011 N 245-ФЗ)
Счет-фактура является документом, служащим основанием для принятия покупателем, исполняющим обязанности налогового агента в соответствии с пунктом 8 статьи 161 настоящего Кодекса, исчисленных сумм налога к вычету в порядке, предусмотренном настоящей главой.
(абзац введен Федеральным законом от 27.11.2017 N 335-ФЗ)
Корректировочный счет-фактура, составленный при изменении стоимости отгруженных товаров, указанных в абзаце первом пункта 8 статьи 161 настоящего Кодекса, в том числе в случае изменения цены и (или) изменения количества (объема) отгруженных товаров, является документом, служащим основанием для принятия покупателем, исполняющим обязанности налогового агента в соответствии с пунктом 8 статьи 161 настоящего Кодекса, сумм налога к вычету в порядке, предусмотренном настоящей главой.
(абзац введен Федеральным законом от 27.11.2017 N 335-ФЗ)
1.1. При реализации, передаче в составе выполненных работ товаров, подлежащих прослеживаемости, счета-фактуры, в том числе корректировочные счета-фактуры, выставляются в электронной форме, за исключением случаев:
(в ред. Федерального закона от 31.07.2023 N 389-ФЗ)
1) реализации, передачи в составе выполненных работ товаров, подлежащих прослеживаемости, физическим лицам для личных, семейных, домашних и иных не связанных с предпринимательской деятельностью нужд, а также налогоплательщикам налога на профессиональный доход;
(в ред. Федерального закона от 31.07.2023 N 389-ФЗ)
2) реализации и перемещения товаров, подлежащих прослеживаемости, с территории Российской Федерации в соответствии с таможенной процедурой экспорта (реэкспорта);
3) реализации и перемещения товаров, подлежащих прослеживаемости, с территории Российской Федерации на территорию другого государства - члена Евразийского экономического союза.
(п. 1.1 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
1.2. Организации и (или) индивидуальные предприниматели при приобретении, получении в составе выполненных работ товаров, подлежащих прослеживаемости, обязаны обеспечить получение счетов-фактур, в том числе корректировочных счетов-фактур, в электронной форме по телекоммуникационным каналам связи через оператора электронного документооборота, являющегося российской организацией и соответствующего требованиям, утвержденным федеральным органом исполнительной власти, уполномоченным по контролю и надзору в области налогов и сборов.
(п. 1.2 введен Федеральным законом от 09.11.2020 N 371-ФЗ; в ред. Федерального закона от 31.07.2023 N 389-ФЗ)
2. Счета-фактуры являются основанием для принятия предъявленных покупателю продавцом сумм налога к вычету при выполнении требований, установленных пунктами 5, 5.1 и 6 настоящей статьи. Корректировочный счет-фактура, выставленный продавцом покупателю товаров (работ, услуг), имущественных прав при изменении стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав в сторону уменьшения, в том числе в случае уменьшения цены (тарифа) и (или) уменьшения количества (объема) отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, является основанием для принятия продавцом товаров (работ, услуг), имущественных прав сумм налога к вычету при выполнении требований, установленных пунктами 5.2 и 6 настоящей статьи.
(в ред. Федерального закона от 19.07.2011 N 245-ФЗ)
Ошибки в счетах-фактурах и корректировочных счетах-фактурах, не препятствующие налоговым органам при проведении налоговой проверки идентифицировать продавца, покупателя товаров (работ, услуг), имущественных прав, наименование товаров (работ, услуг), имущественных прав, их стоимость, налоговую ставку и сумму налога, предъявленную покупателю, а также неуказание (неверное указание) в счете-фактуре сведений, установленных подпунктами 16 - 18 пункта 5 настоящей статьи, не являются основанием для отказа в принятии к вычету сумм налога.
(в ред. Федеральных законов от 19.07.2011 N 245-ФЗ, от 09.11.2020 N 371-ФЗ)
Невыполнение требований к счету-фактуре, не предусмотренных пунктами 5 и 6 настоящей статьи, не может являться основанием для отказа принять к вычету суммы налога, предъявленные продавцом. Невыполнение не предусмотренных пунктами 5.2 и 6 настоящей статьи требований к корректировочному счету-фактуре, выставленному продавцом покупателю товаров (работ, услуг), имущественных прав при изменении стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав в сторону уменьшения, в том числе в случае уменьшения цены (тарифа) и (или) уменьшения количества (объема) отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, не может являться основанием для отказа в принятии к вычету продавцом суммы налога.
(в ред. Федерального закона от 19.07.2011 N 245-ФЗ)
Положения настоящего пункта применяются также к счетам-фактурам, корректировочным счетам-фактурам, выставляемым налогоплательщиком покупателю, исполняющему обязанности налогового агента в соответствии с пунктом 8 статьи 161 настоящего Кодекса.
(абзац введен Федеральным законом от 27.11.2017 N 335-ФЗ)
(п. 2 в ред. Федерального закона от 17.12.2009 N 318-ФЗ)
3. Налогоплательщик (в том числе являющийся налоговым агентом) обязан составить счет-фактуру, вести книги покупок и книги продаж:
(в ред. Федеральных законов от 20.04.2014 N 81-ФЗ, от 03.08.2018 N 302-ФЗ)
1) при совершении операций, признаваемых объектом налогообложения в соответствии с настоящей главой (за исключением операций, не подлежащих налогообложению (освобождаемых от налогообложения) в соответствии со статьей 149 настоящего Кодекса, если иное не предусмотрено подпунктом 1.1 настоящего пункта). При совершении операций по реализации товаров (работ, услуг), имущественных прав, за исключением операций по реализации товаров, подлежащих прослеживаемости, лицам, не являющимся налогоплательщиками налога на добавленную стоимость, и налогоплательщикам, освобожденным от исполнения обязанностей налогоплательщика, связанных с исчислением и уплатой налога, по письменному согласию сторон сделки счета-фактуры не составляются;
(в ред. Федеральных законов от 21.07.2014 N 238-ФЗ, от 29.11.2014 N 382-ФЗ, от 30.05.2016 N 150-ФЗ, от 09.11.2020 N 371-ФЗ)
1.1) при совершении операций по реализации товаров, не подлежащих налогообложению (освобождаемых от налогообложения) в соответствии со статьей 149 настоящего Кодекса, вывезенных за пределы территории Российской Федерации на территорию государства - члена Евразийского экономического союза;
(пп. 1.1 введен Федеральным законом от 30.05.2016 N 150-ФЗ)
2) в иных случаях, определенных в установленном порядке.
(п. 3 в ред. Федерального закона от 28.12.2013 N 420-ФЗ)
3.1. Налогоплательщики, в том числе освобожденные от исполнения обязанностей налогоплательщика, связанных с исчислением и уплатой налога, лица, не являющиеся налогоплательщиками, в случае выставления и (или) получения ими счетов-фактур при осуществлении предпринимательской деятельности в интересах другого лица на основе договоров комиссии, агентских договоров, предусматривающих реализацию и (или) приобретение товаров (работ, услуг), имущественных прав от имени комиссионера (агента), или на основе договоров транспортной экспедиции, а также при выполнении функций застройщика обязаны вести журнал учета полученных и выставленных счетов-фактур в отношении указанной деятельности.
Для налогоплательщиков, осуществляющих предпринимательскую деятельность на основе договоров транспортной экспедиции, положения абзаца первого настоящего пункта применяются в случае определения ими налоговой базы как суммы дохода, полученной в виде вознаграждения при исполнении данных договоров.
Для лиц, осуществляющих предпринимательскую деятельность на основе договоров транспортной экспедиции, не являющихся налогоплательщиками налога на добавленную стоимость либо являющихся налогоплательщиками, освобожденными от исполнения обязанностей налогоплательщика, связанных с исчислением и уплатой налога, положения абзаца первого настоящего пункта применяются в случае, если при определении ими налоговой базы в порядке, установленном главами 23, 25, 26.1 и 26.2 настоящего Кодекса, в составе доходов учитываются доходы в виде вознаграждения при исполнении данных договоров.
В журнале учета полученных и выставленных счетов-фактур не подлежат регистрации счета-фактуры, выставленные на сумму дохода в виде вознаграждения при исполнении указанных в настоящем пункте договоров.
Положения настоящего пункта не распространяются на налоговых агентов, указанных в пунктах 4, 5 и 5.1 статьи 161 настоящего Кодекса.
(абзац введен Федеральным законом от 03.08.2018 N 302-ФЗ)
(п. 3.1 в ред. Федерального закона от 21.07.2014 N 238-ФЗ)
3.2. Иностранные лица, подлежащие постановке на учет в соответствии с пунктом 4.6 статьи 83 настоящего Кодекса, счета-фактуры не составляют, книги покупок, книги продаж, журнал учета полученных и выставленных счетов-фактур при оказании услуг в электронной форме, указанных в пункте 1 статьи 174.2 настоящего Кодекса, а также при реализации товаров в соответствии со статьей 174.3 настоящего Кодекса не ведут.
(п. 3.2 в ред. Федерального закона от 29.05.2024 N 100-ФЗ)
4. Утратил силу с 1 января 2014 года. - Федеральный закон от 28.12.2013 N 420-ФЗ.
5. В счете-фактуре, выставляемом при реализации товаров (работ, услуг), передаче имущественных прав, должны быть указаны:
(в ред. Федерального закона от 26.11.2008 N 224-ФЗ)
1) порядковый номер и дата составления счета-фактуры;
(в ред. Федерального закона от 27.07.2010 N 229-ФЗ)
2) наименование, адрес и идентификационные номера налогоплательщика (налогового агента) и покупателя;
(в ред. Федерального закона от 03.08.2018 N 302-ФЗ)
3) наименование и адрес грузоотправителя и грузополучателя;
4) номер платежно-расчетного документа в случае получения оплаты, частичной оплаты или иных платежей в счет предстоящих поставок товаров (выполнения работ, оказания услуг), передачи имущественных прав, а также порядковый номер и дата составления счета-фактуры, выставленного при получении оплаты, частичной оплаты или иных платежей в счет предстоящих поставок товаров (выполнения работ, оказания услуг), передаче имущественных прав, в оплату которых подлежат зачету указанные суммы оплаты, частичной оплаты, реквизиты, позволяющие идентифицировать документ об отгрузке товаров (о выполнении работ, об оказании услуг), о передаче имущественных прав;
(в ред. Федеральных законов от 09.11.2020 N 371-ФЗ, от 28.11.2025 N 425-ФЗ)
5) порядковый номер записи поставляемых (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав, наименование поставляемых (отгруженных) товаров (описание выполненных работ, оказанных услуг), переданных имущественных прав и единица измерения (при возможности ее указания);
(пп. 5 в ред. Федерального закона от 09.11.2020 N 371-ФЗ)
6) количество (объем) поставляемых (отгруженных) по счету-фактуре товаров (работ, услуг), исходя из принятых по нему единиц измерения (при возможности их указания);
(в ред. Федерального закона от 29.05.2002 N 57-ФЗ)
6.1) наименование валюты;
(пп. 6.1 введен Федеральным законом от 27.07.2010 N 229-ФЗ)
6.2) идентификатор государственного контракта, договора (соглашения) (при наличии);
(пп. 6.2 введен Федеральным законом от 03.04.2017 N 56-ФЗ)
7) цена (тариф) за единицу измерения (при возможности ее указания) по договору (контракту) без учета налога, а в случае применения государственных регулируемых цен (тарифов), включающих в себя налог, с учетом суммы налога;
(в ред. Федерального закона от 29.05.2002 N 57-ФЗ)
8) стоимость товаров (работ, услуг), имущественных прав за все количество поставляемых (отгруженных) по счету-фактуре товаров (выполненных работ, оказанных услуг), переданных имущественных прав без налога;
(в ред. Федерального закона от 22.07.2005 N 119-ФЗ)
9) сумма акциза по подакцизным товарам;
10) налоговая ставка;
11) сумма налога, предъявляемая покупателю товаров (работ, услуг), имущественных прав, определяемая исходя из применяемых налоговых ставок;
(в ред. Федерального закона от 22.07.2005 N 119-ФЗ)
12) стоимость всего количества поставляемых (отгруженных) по счету-фактуре товаров (выполненных работ, оказанных услуг), переданных имущественных прав с учетом суммы налога;
(в ред. Федерального закона от 22.07.2005 N 119-ФЗ)
13) исключен. - Федеральный закон от 29.12.2000 N 166-ФЗ;
13) страна происхождения товара;
14) регистрационный номер декларации на товары;
(пп. 14 в ред. Федерального закона от 09.11.2020 N 371-ФЗ)
15) код вида товара в соответствии с единой Товарной номенклатурой внешнеэкономической деятельности Евразийского экономического союза. Сведения, предусмотренные настоящим подпунктом, указываются в отношении товаров, вывезенных за пределы территории Российской Федерации на территорию государства - члена Евразийского экономического союза;
(пп. 15 введен Федеральным законом от 30.05.2016 N 150-ФЗ)
16) регистрационный номер партии товара, подлежащего прослеживаемости;
(пп. 16 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
17) количественная единица измерения товара, используемая в целях осуществления прослеживаемости;
(пп. 17 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
18) количество товара, подлежащего прослеживаемости, в количественной единице измерения товара, используемой в целях осуществления прослеживаемости;
(пп. 18 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
19) стоимость товара, подлежащего прослеживаемости.
(пп. 19 введен Федеральным законом от 31.07.2023 N 389-ФЗ)
Сведения, предусмотренные подпунктом 13 настоящего пункта, указываются в отношении товаров, страной происхождения которых не является Российская Федерация. Сведения, предусмотренные подпунктом 14 настоящего пункта, указываются в отношении товаров, страной происхождения которых не являются государства - члены Евразийского экономического союза. Налогоплательщик, реализующий указанные товары, несет ответственность только за соответствие указанных сведений в предъявляемых им счетах-фактурах сведениям, содержащимся в полученных им счетах-фактурах и товаросопроводительных документах.
(в ред. Федеральных законов от 29.12.2000 N 166-ФЗ, от 09.11.2020 N 371-ФЗ)
Сведения, предусмотренные подпунктами 16 - 19 настоящего пункта, указываются при реализации товаров (в том числе в составе комплектов (наборов), подлежащих прослеживаемости, а также при передаче товаров, подлежащих прослеживаемости, в составе выполненных работ.
(в ред. Федерального закона от 31.07.2023 N 389-ФЗ)
5.1. В счете-фактуре, выставляемом при получении оплаты, частичной оплаты в счет предстоящих поставок товаров (выполнения работ, оказания услуг), передачи имущественных прав, должны быть указаны:
1) порядковый номер и дата составления счета-фактуры;
(в ред. Федерального закона от 27.07.2010 N 229-ФЗ)
2) наименование, адрес и идентификационные номера налогоплательщика (налогового агента) и покупателя;
(в ред. Федерального закона от 03.08.2018 N 302-ФЗ)
3) номер платежно-расчетного документа;
4) наименование поставляемых товаров (описание работ, услуг), имущественных прав;
4.1) наименование валюты;
(пп. 4.1 введен Федеральным законом от 27.07.2010 N 229-ФЗ)
4.2) идентификатор государственного контракта, договора (соглашения) (при наличии);
(пп. 4.2 введен Федеральным законом от 03.04.2017 N 56-ФЗ)
5) сумма оплаты, частичной оплаты в счет предстоящих поставок товаров (выполнения работ, оказания услуг), передачи имущественных прав;
6) налоговая ставка;
7) сумма налога, предъявляемая покупателю товаров (работ, услуг), имущественных прав, определяемая исходя из применяемых налоговых ставок.
(п. 5.1 введен Федеральным законом от 26.11.2008 N 224-ФЗ)
5.2. В корректировочном счете-фактуре, выставляемом при изменении стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, в том числе в случае изменения цены (тарифа) и (или) уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), имущественных прав, должны быть указаны:
1) наименование "корректировочный счет-фактура", порядковый номер и дата составления корректировочного счета-фактуры;
2) порядковый номер и дата составления счета-фактуры (счетов-фактур), по которому (которым) осуществляется изменение стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, в том числе в случае изменения цены (тарифа) и (или) уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав;
(в ред. Федерального закона от 05.04.2013 N 39-ФЗ)
3) наименования, адреса и идентификационные номера налогоплательщика (налогового агента) и покупателя;
(в ред. Федерального закона от 03.08.2018 N 302-ФЗ)
4) порядковый номер записи поставляемых (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав, наименование поставляемых (отгруженных) товаров (описание выполненных работ, оказанных услуг), переданных имущественных прав и единица измерения (при возможности ее указания), по которым осуществляются изменение цены (тарифа) и (или) уточнение количества (объема);
(пп. 4 в ред. Федерального закона от 09.11.2020 N 371-ФЗ)
5) количество (объем) товаров (работ, услуг) по счету-фактуре (счетам-фактурам) исходя из принятых по нему единиц измерения (при возможности их указания) до и после уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав;
(в ред. Федерального закона от 05.04.2013 N 39-ФЗ)
6) наименование валюты;
6.1) идентификатор государственного контракта, договора (соглашения) (при наличии);
(пп. 6.1 введен Федеральным законом от 03.04.2017 N 56-ФЗ)
7) цена (тариф) за единицу измерения (при возможности ее указания) без учета налога, а в случае применения государственных регулируемых цен (тарифов), включающих в себя налог, с учетом суммы налога до и после изменения цены (тарифа);
8) стоимость всего количества товаров (работ, услуг), имущественных прав по счету-фактуре (счетам-фактурам) без налога до и после внесенных изменений;
(в ред. Федерального закона от 05.04.2013 N 39-ФЗ)
9) сумма акциза по подакцизным товарам;
10) налоговая ставка;
11) сумма налога, определяемая исходя из применяемых налоговых ставок до и после изменения стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, в том числе в случае изменения цены (тарифа) и (или) уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав;
12) стоимость всего количества товаров (работ, услуг), имущественных прав по счету-фактуре (счетам-фактурам) с учетом суммы налога до и после изменения стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, в том числе в случае изменения цены (тарифа) и (или) уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав;
(в ред. Федерального закона от 05.04.2013 N 39-ФЗ)
13) разница между показателями счета-фактуры (счетов-фактур), по которому (которым) осуществляется изменение стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, в том числе в случае изменения цены (тарифа) и (или) уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав, и показателями, исчисленными после изменения стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, в том числе в случае изменения цены (тарифа) и (или) уточнения количества (объема) поставленных (отгруженных) товаров (выполненных работ, оказанных услуг), переданных имущественных прав.
(в ред. Федерального закона от 05.04.2013 N 39-ФЗ)
Налогоплательщик вправе составить единый корректировочный счет-фактуру на изменение стоимости отгруженных товаров (выполненных работ, оказанных услуг), переданных имущественных прав, указанных в двух и более счетах-фактурах, составленных этим налогоплательщиком ранее;
(в ред. Федерального закона от 05.04.2013 N 39-ФЗ)
14) страна происхождения товара;
(пп. 14 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
15) регистрационный номер декларации на товары;
(пп. 15 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
16) регистрационный номер партии товара, подлежащего прослеживаемости;
(пп. 16 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
17) количественная единица измерения товара, используемая в целях осуществления прослеживаемости;
(пп. 17 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
18) количество товара, подлежащего прослеживаемости, в количественной единице измерения товара, используемой в целях осуществления прослеживаемости;
(пп. 18 введен Федеральным законом от 09.11.2020 N 371-ФЗ)
19) стоимость товара, подлежащего прослеживаемости.
(пп. 19 введен Федеральным законом от 31.07.2023 N 389-ФЗ)
(п. 5.2 введен Федеральным законом от 19.07.2011 N 245-ФЗ)
6. Счет-фактура подписывается руководителем и главным бухгалтером организации либо иными лицами, уполномоченными на то приказом (иным распорядительным документом) по организации или доверенностью от имени организации. При выставлении счета-фактуры индивидуальным предпринимателем счет-фактура подписывается индивидуальным предпринимателем либо иным лицом, уполномоченным доверенностью от имени индивидуального предпринимателя, с указанием основного государственного регистрационного номера индивидуального предпринимателя и даты присвоения такого номера.
(в ред. Федеральных законов от 20.04.2014 N 81-ФЗ, от 28.11.2025 N 425-ФЗ)
Счет-фактура, составленный в электронной форме, подписывается усиленной квалифицированной электронной подписью руководителя организации либо иных лиц, уполномоченных на это приказом (иным распорядительным документом) по организации или доверенностью от имени организации, индивидуального предпринимателя в соответствии с законодательством Российской Федерации.
(абзац введен Федеральным законом от 27.07.2010 N 229-ФЗ, в ред. Федерального закона от 29.06.2012 N 97-ФЗ)
7. В случае, если по условиям сделки обязательство выражено в иностранной валюте, то суммы, указываемые в счете-фактуре, могут быть выражены в иностранной валюте.
(в ред. Федерального закона от 29.12.2000 N 166-ФЗ)
8. Форма счета-фактуры и порядок его заполнения, формы и порядок ведения журнала учета полученных и выставленных счетов-фактур, книг покупок и книг продаж устанавливаются Правительством Российской Федерации.
(п. 8 в ред. Федерального закона от 27.07.2010 N 229-ФЗ)
9. Порядок выставления и получения счетов-фактур в электронной форме по телекоммуникационным каналам связи с применением усиленной квалифицированной электронной подписи устанавливается Министерством финансов Российской Федерации.
(в ред. Федерального закона от 29.06.2012 N 97-ФЗ)
Форматы счета-фактуры, журнала учета полученных и выставленных счетов-фактур, книг покупок и книг продаж в электронной форме утверждаются федеральным органом исполнительной власти, уполномоченным по контролю и надзору в области налогов и сборов.
(в ред. Федерального закона от 29.06.2012 N 97-ФЗ)
(п. 9 введен Федеральным законом от 27.07.2010 N 229-ФЗ)"""
revision = "ред. от 04.08.2026 (с изм. и доп., вступ. в силу с 01.10.2026)"
