[[law]]
id = "nk-252"
short = "НК РФ"
act = "Налоговый кодекс Российской Федерации (часть вторая)"
number = "117-ФЗ"
article = "Статья 252"
title = "Расходы. Группировка расходов"
text = """1. В целях настоящей главы налогоплательщик уменьшает полученные доходы на сумму произведенных расходов (за исключением расходов, указанных в статье 270 настоящего Кодекса).
Расходами признаются обоснованные и документально подтвержденные затраты (а в случаях, предусмотренных статьей 265 настоящего Кодекса, убытки), осуществленные (понесенные) налогоплательщиком.
Под обоснованными расходами понимаются экономически оправданные затраты, оценка которых выражена в денежной форме.
Под документально подтвержденными расходами понимаются затраты, подтвержденные документами, оформленными в соответствии с законодательством Российской Федерации, либо документами, оформленными в соответствии с обычаями делового оборота, применяемыми в иностранном государстве, на территории которого были произведены соответствующие расходы, и (или) документами, косвенно подтверждающими произведенные расходы (в том числе таможенной декларацией, приказом о командировке, проездными документами, отчетом о выполненной работе в соответствии с договором). Расходами признаются любые затраты при условии, что они произведены для осуществления деятельности, направленной на получение дохода.
(в ред. Федерального закона от 06.06.2005 N 58-ФЗ)
2. Расходы в зависимости от их характера, а также условий осуществления и направлений деятельности налогоплательщика подразделяются на расходы, связанные с производством и реализацией, и внереализационные расходы.
(в ред. Федерального закона от 29.05.2002 N 57-ФЗ)
Абзац исключен. - Федеральный закон от 29.05.2002 N 57-ФЗ.
2.1. В целях настоящей главы расходами вновь созданных и реорганизованных организаций признается стоимость (остаточная стоимость) имущества, имущественных и неимущественных прав, имеющих денежную оценку, и (или) обязательств, получаемых в порядке правопреемства при реорганизации юридических лиц, которые были приобретены (созданы) реорганизуемыми организациями до даты завершения реорганизации. Стоимость имущества, имущественных и неимущественных прав, имеющих денежную оценку, определяется по данным и документам налогового учета передающей стороны на дату перехода права собственности на указанные имущество, имущественные и неимущественные права.
(в ред. Федерального закона от 26.11.2008 N 224-ФЗ)
Расходами вновь созданных и реорганизованных организаций также признаются расходы (а в случаях, предусмотренных настоящим Кодексом, убытки), предусмотренные статьями 255, 260 - 268, 275, 275.1, 279, 280, 283, 304, 318 - 320 настоящей главы, осуществленные (понесенные) реорганизуемыми организациями в той части, которая не была учтена ими при формировании налоговой базы. В целях налогообложения указанные расходы учитываются организациями-правопреемниками в порядке и на условиях, которые предусмотрены настоящей главой. Состав таких расходов и их оценка определяются по данным и документам налогового учета реорганизуемых организаций на дату завершения реорганизации (дату внесения записи о прекращении деятельности каждого присоединяемого юридического лица - при реорганизации в форме присоединения).
Дополнительные расходы, связанные с передачей (получением) имущества (имущественных и неимущественных прав) при реорганизации организаций, в целях налогообложения учитываются в порядке, установленном настоящей главой.
(в ред. Федерального закона от 26.11.2008 N 224-ФЗ)
(п. 2.1 введен Федеральным законом от 06.06.2005 N 58-ФЗ)
3. Особенности определения расходов, признаваемых для целей налогообложения, для отдельных категорий налогоплательщиков либо расходов, произведенных в связи с особыми обстоятельствами, устанавливаются положениями настоящей главы.
4. Если некоторые затраты с равными основаниями могут быть отнесены одновременно к нескольким группам расходов, налогоплательщик вправе самостоятельно определить, к какой именно группе он отнесет такие затраты.
(в ред. Федерального закона от 06.06.2005 N 58-ФЗ)
5. Понесенные налогоплательщиком расходы, стоимость которых выражена в иностранной валюте, учитываются в совокупности с расходами, стоимость которых выражена в рублях.
Понесенные налогоплательщиком расходы, стоимость которых выражена в условных единицах, учитываются в совокупности с расходами, стоимость которых выражена в рублях.
Пересчет указанных расходов производится налогоплательщиком в зависимости от выбранного в учетной политике для целей налогообложения метода признания таких расходов в соответствии со статьями 272 и 273 настоящего Кодекса.
В целях настоящей главы суммы, отраженные в составе расходов налогоплательщиков, не подлежат повторному включению в состав его расходов.
(п. 5 введен Федеральным законом от 29.05.2002 N 57-ФЗ)
6. Стоимость имущества (имущественного права), полученного (принятого к учету) налогоплательщиком без несения соответствующих расходов на его приобретение, определяется в размере дохода, подлежащего налогообложению, признанного при получении данного имущества (имущественного права), если иное не предусмотрено настоящей главой, с учетом расходов, связанных с доведением его до состояния, в котором оно пригодно для использования.
(п. 6 введен Федеральным законом от 31.07.2023 N 389-ФЗ)"""
revision = "ред. от 04.08.2026 (с изм. и доп., вступ. в силу с 01.10.2026)"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_28165/ef9b3e2f8e3046127b2ef57fccf5141b694e2138/"
retrieved = "2026-11-27"

[[law]]
id = "tk-99"
short = "ТК РФ"
act = "Трудовой кодекс Российской Федерации"
number = "197-ФЗ"
article = "Статья 99"
title = "Сверхурочная работа"
text = """(в ред. Федерального закона от 30.06.2006 N 90-ФЗ)
Сверхурочная работа - работа, выполняемая работником по инициативе работодателя за пределами установленной для работника продолжительности рабочего времени: ежедневной работы (смены), а при суммированном учете рабочего времени - сверх нормального числа рабочих часов за учетный период.
Привлечение работодателем работника к сверхурочной работе допускается с его письменного согласия в следующих случаях:
1) при необходимости выполнить (закончить) начатую работу, которая вследствие непредвиденной задержки по техническим условиям производства не могла быть выполнена (закончена) в течение установленной для работника продолжительности рабочего времени, если невыполнение (незавершение) этой работы может повлечь за собой порчу или гибель имущества работодателя (в том числе имущества третьих лиц, находящегося у работодателя, если работодатель несет ответственность за сохранность этого имущества), государственного или муниципального имущества либо создать угрозу жизни и здоровью людей;
2) при производстве временных работ по ремонту и восстановлению механизмов или сооружений в тех случаях, когда их неисправность может стать причиной прекращения работы для значительного числа работников;
3) для продолжения работы при неявке сменяющего работника, если работа не допускает перерыва. В этих случаях работодатель обязан немедленно принять меры по замене сменщика другим работником.
Привлечение работодателем работника к сверхурочной работе без его согласия допускается в следующих случаях:
1) при производстве работ, необходимых для предотвращения катастрофы, производственной аварии либо устранения последствий катастрофы, производственной аварии или стихийного бедствия;
2) при производстве общественно необходимых работ по устранению непредвиденных обстоятельств, нарушающих нормальное функционирование централизованных систем горячего водоснабжения, холодного водоснабжения и (или) водоотведения, систем газоснабжения, теплоснабжения, освещения, транспорта, связи;
(в ред. Федерального закона от 07.12.2011 N 417-ФЗ)
3) при производстве работ, необходимость которых обусловлена введением чрезвычайного или военного положения, либо неотложных работ в условиях чрезвычайных обстоятельств, то есть в случае бедствия или угрозы бедствия (пожары, наводнения, голод, землетрясения, эпидемии или эпизоотии) и в иных случаях, ставящих под угрозу жизнь или нормальные жизненные условия всего населения или его части, а также в случаях, предусмотренных настоящим Кодексом.
(в ред. Федерального закона от 14.07.2022 N 273-ФЗ)
В других случаях привлечение к сверхурочной работе допускается с письменного согласия работника и с учетом мнения выборного органа первичной профсоюзной организации.
Не допускается привлечение к сверхурочной работе беременных женщин, работников в возрасте до восемнадцати лет, других категорий работников в соответствии с настоящим Кодексом и иными федеральными законами. Привлечение к сверхурочной работе инвалидов, женщин, имеющих детей в возрасте до трех лет, матерей и отцов, воспитывающих без супруга (супруги) детей в возрасте до четырнадцати лет, опекунов детей указанного возраста, родителя, имеющего ребенка в возрасте до четырнадцати лет, в случае, если другой родитель работает вахтовым методом, а также работников, имеющих трех и более детей в возрасте до восемнадцати лет, в период до достижения младшим из детей возраста четырнадцати лет допускается только с их письменного согласия и при условии, если это не запрещено им по состоянию здоровья в соответствии с медицинским заключением, выданным в порядке, установленном федеральными законами и иными нормативными правовыми актами Российской Федерации. При этом указанные работники должны быть в письменной форме ознакомлены со своим правом отказаться от сверхурочной работы.
(в ред. Федерального закона от 19.11.2021 N 372-ФЗ)
Продолжительность сверхурочной работы не должна превышать для каждого работника 4 часов в день и 120 часов в год, за исключением случаев, предусмотренных настоящим Кодексом. Продолжительность сверхурочной работы для каждого работника может быть увеличена до 240 часов в год, если это предусмотрено коллективным договором и (или) отраслевым (межотраслевым) соглашением, распространяющимся на данного работодателя.
(часть шестая в ред. Федерального закона от 25.05.2026 N 144-ФЗ)
Продолжительность сверхурочной работы не должна превышать 120 часов в год для следующих категорий работников:
1) работники государственных и муниципальных учреждений, продолжительность работы которых по внутреннему совместительству превышает одну четвертую месячной нормы рабочего времени (нормы рабочего времени за другой учетный период), установленной для соответствующей категории работников;
2) работники, условия труда на рабочих местах которых по результатам специальной оценки условий труда отнесены к вредным условиям труда подклассов 3.3 и 3.4.
(часть седьмая введена Федеральным законом от 25.05.2026 N 144-ФЗ)
Привлечение к сверхурочной работе, продолжительность которой превышает 120 часов в год, лиц пенсионного и предпенсионного возраста, работников, условия труда на рабочих местах которых по результатам специальной оценки условий труда отнесены к вредным условиям труда подклассов 3.1 и 3.2, допускается только с их письменного согласия и при условии, что это не запрещено им по состоянию здоровья в соответствии с медицинским заключением, выданным в порядке, установленном федеральными законами и иными нормативными правовыми актами Российской Федерации. При этом указанные работники должны быть в письменной форме ознакомлены со своим правом отказаться от сверхурочной работы, за исключением случаев, предусмотренных частью третьей настоящей статьи.
(часть восьмая введена Федеральным законом от 25.05.2026 N 144-ФЗ)
Привлечение работника к сверхурочной работе сверх 120 часов в год допускается с его письменного согласия в соответствии с правилами допуска к сверхурочной работе, установленными коллективным договором, соглашением или локальным нормативным актом, которыми предусматривается порядок направления на предварительное прохождение работником по его письменному заявлению профилактического медицинского осмотра, диспансеризации или периодического медицинского осмотра в случаях и порядке, которые предусмотрены законодательством в сфере охраны здоровья.
(часть девятая введена Федеральным законом от 25.05.2026 N 144-ФЗ)
Работодатель обязан обеспечить точный учет продолжительности сверхурочной работы каждого работника."""
revision = "ред. от 25.05.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_34683/ff4c79fea2e01934abc407be13af36cc7a15054c/"
retrieved = "2026-11-27"

[[law]]
id = "tk-113"
short = "ТК РФ"
act = "Трудовой кодекс Российской Федерации"
number = "197-ФЗ"
article = "Статья 113"
title = "Запрещение работы в выходные и нерабочие праздничные дни. Исключительные случаи привлечения работников к работе в выходные и нерабочие праздничные дни"
text = """(в ред. Федерального закона от 30.06.2006 N 90-ФЗ)
Работа в выходные и нерабочие праздничные дни запрещается, за исключением случаев, предусмотренных настоящим Кодексом.
Привлечение работников к работе в выходные и нерабочие праздничные дни производится с их письменного согласия в случае необходимости выполнения заранее непредвиденных работ, от срочного выполнения которых зависит в дальнейшем нормальная работа организации в целом или ее отдельных структурных подразделений, индивидуального предпринимателя.
Привлечение работников к работе в выходные и нерабочие праздничные дни без их согласия допускается в следующих случаях:
1) для предотвращения катастрофы, производственной аварии либо устранения последствий катастрофы, производственной аварии или стихийного бедствия;
2) для предотвращения несчастных случаев, уничтожения или порчи имущества работодателя, государственного или муниципального имущества;
3) для выполнения работ, необходимость которых обусловлена введением чрезвычайного или военного положения, либо неотложных работ в условиях чрезвычайных обстоятельств, то есть в случае бедствия или угрозы бедствия (пожары, наводнения, голод, землетрясения, эпидемии или эпизоотии) и в иных случаях, ставящих под угрозу жизнь или нормальные жизненные условия всего населения или его части, а также в случаях, предусмотренных настоящим Кодексом.
(в ред. Федерального закона от 14.07.2022 N 273-ФЗ)
Привлечение к работе в выходные и нерабочие праздничные дни творческих работников средств массовой информации, организаций кинематографии, теле- и видеосъемочных коллективов, театров, театральных и концертных организаций, цирков и иных лиц, участвующих в создании и (или) исполнении (экспонировании) произведений, в соответствии с перечнями работ, профессий, должностей этих работников, утверждаемыми Правительством Российской Федерации с учетом мнения Российской трехсторонней комиссии по регулированию социально-трудовых отношений, допускается в порядке, устанавливаемом коллективным договором, локальным нормативным актом, трудовым договором.
(в ред. Федерального закона от 28.02.2008 N 13-ФЗ)
В других случаях привлечение к работе в выходные и нерабочие праздничные дни допускается с письменного согласия работника и с учетом мнения выборного органа первичной профсоюзной организации.
В нерабочие праздничные дни допускается производство работ, приостановка которых невозможна по производственно-техническим условиям (непрерывно действующие организации), работ, вызываемых необходимостью обслуживания населения, а также неотложных ремонтных и погрузочно-разгрузочных работ.
Привлечение к работе в выходные и нерабочие праздничные дни инвалидов, женщин, имеющих детей в возрасте до трех лет, допускается только при условии, если это не запрещено им по состоянию здоровья в соответствии с медицинским заключением, выданным в порядке, установленном федеральными законами и иными нормативными правовыми актами Российской Федерации. При этом инвалиды, женщины, имеющие детей в возрасте до трех лет, должны быть под роспись ознакомлены со своим правом отказаться от работы в выходной или нерабочий праздничный день.
Привлечение работников к работе в выходные и нерабочие праздничные дни производится по письменному распоряжению работодателя."""
revision = "ред. от 25.05.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_34683/7d22494d1486cfffbc4efaf51dc2e5af86ffb8f9/"
retrieved = "2026-11-27"

[[law]]
id = "tk-153"
short = "ТК РФ"
act = "Трудовой кодекс Российской Федерации"
number = "197-ФЗ"
article = "Статья 153"
title = "Оплата труда в выходные и нерабочие праздничные дни"
text = """(в ред. Федерального закона от 30.06.2006 N 90-ФЗ)
Работа в выходной или нерабочий праздничный день оплачивается не менее чем в двойном размере:
сдельщикам - не менее чем по двойным сдельным расценкам;
работникам, труд которых оплачивается по дневным и часовым тарифным ставкам, - в размере не менее двойной дневной или часовой тарифной ставки;
работникам, получающим оклад (должностной оклад), - в размере не менее одинарной дневной или часовой ставки (части оклада (должностного оклада) за день или час работы) сверх оклада (должностного оклада), если работа в выходной или нерабочий праздничный день производилась в пределах месячной нормы рабочего времени, и в размере не менее двойной дневной или часовой ставки (части оклада (должностного оклада) за день или час работы) сверх оклада (должностного оклада), если работа производилась сверх месячной нормы рабочего времени.
Конкретные размеры оплаты за работу в выходной или нерабочий праздничный день могут устанавливаться коллективным договором, локальным нормативным актом, принимаемым с учетом мнения представительного органа работников, трудовым договором.
Оплата в повышенном размере производится всем работникам за часы, фактически отработанные в выходной или нерабочий праздничный день. Если на выходной или нерабочий праздничный день приходится часть рабочего дня (смены), в повышенном размере оплачиваются часы, фактически отработанные в выходной или нерабочий праздничный день (от 0 часов до 24 часов).
(часть третья введена Федеральным законом от 18.06.2017 N 125-ФЗ)
По желанию работника, работавшего в выходной или нерабочий праздничный день, ему может быть предоставлен другой день отдыха. В этом случае работа в выходной или нерабочий праздничный день оплачивается в одинарном размере, а день отдыха оплате не подлежит.
День отдыха, указанный в части четвертой настоящей статьи, по желанию работника может быть использован в течение одного года со дня работы в выходной или нерабочий праздничный день либо присоединен к отпуску, предоставляемому в указанный период.
(часть пятая введена Федеральным законом от 30.09.2024 N 339-ФЗ)
В случае, если на день увольнения работника имеется день отдыха за работу в выходной или нерабочий праздничный день, не использованный им в период трудовой деятельности у работодателя, с которым прекращается трудовой договор, в день увольнения работнику выплачивается разница между оплатой работы в выходной или нерабочий праздничный день, полагавшейся ему в соответствии с частями первой - третьей настоящей статьи, и фактически произведенной оплатой работы в этот день. Указанная разница выплачивается работнику за все дни отдыха за работу в выходные или нерабочие праздничные дни, не использованные им в период трудовой деятельности у данного работодателя.
(часть шестая введена Федеральным законом от 30.09.2024 N 339-ФЗ)
Оплата труда в выходные и нерабочие праздничные дни творческих работников средств массовой информации, организаций кинематографии, теле- и видеосъемочных коллективов, театров, театральных и концертных организаций, цирков и иных лиц, участвующих в создании и (или) исполнении (экспонировании) произведений, в соответствии с перечнями работ, профессий, должностей этих работников, утверждаемыми Правительством Российской Федерации с учетом мнения Российской трехсторонней комиссии по регулированию социально-трудовых отношений, может определяться на основании коллективного договора, локального нормативного акта, трудового договора.
(в ред. Федерального закона от 28.02.2008 N 13-ФЗ)"""
revision = "ред. от 25.05.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_34683/a6a0176ee414c56cbffecc3d3fe9c161603a3b35/"
retrieved = "2026-11-27"

[[law]]
id = "tk-166"
short = "ТК РФ"
act = "Трудовой кодекс Российской Федерации"
number = "197-ФЗ"
article = "Статья 166"
title = "Понятие служебной командировки"
text = """Служебная командировка - поездка работника по распоряжению работодателя на определенный срок для выполнения служебного поручения вне места постоянной работы. Служебные поездки работников, постоянная работа которых осуществляется в пути или имеет разъездной характер, служебными командировками не признаются.
Особенности направления работников в служебные командировки устанавливаются в порядке, определяемом Правительством Российской Федерации.
(часть вторая введена Федеральным законом от 30.06.2006 N 90-ФЗ)"""
revision = "ред. от 25.05.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_34683/9d204a7e952ea1b8293d96849eebc0217b1ab81b/"
retrieved = "2026-11-27"

[[law]]
id = "tk-168"
short = "ТК РФ"
act = "Трудовой кодекс Российской Федерации"
number = "197-ФЗ"
article = "Статья 168"
title = "Возмещение расходов, связанных со служебной командировкой"
text = """В случае направления в служебную командировку работодатель обязан возмещать работнику:
расходы по проезду;
расходы по найму жилого помещения;
дополнительные расходы, связанные с проживанием вне места постоянного жительства (суточные);
иные расходы, произведенные работником с разрешения или ведома работодателя.
Порядок и размеры возмещения расходов, связанных со служебными командировками, работникам федеральных государственных органов, государственных внебюджетных фондов Российской Федерации, федеральных государственных учреждений определяются нормативными правовыми актами Правительства Российской Федерации.
(в ред. Федеральных законов от 02.04.2014 N 55-ФЗ, от 30.04.2021 N 109-ФЗ)
Порядок и размеры возмещения расходов, связанных со служебными командировками, работникам государственных органов субъектов Российской Федерации, территориальных фондов обязательного медицинского страхования, государственных учреждений субъектов Российской Федерации, органов местного самоуправления, муниципальных учреждений определяются соответственно нормативными правовыми актами органов государственной власти субъектов Российской Федерации, нормативными правовыми актами органов местного самоуправления.
(часть третья введена Федеральным законом от 02.04.2014 N 55-ФЗ; в ред. Федеральных законов от 03.07.2016 N 347-ФЗ, от 30.04.2021 N 109-ФЗ)
Порядок и размеры возмещения расходов, связанных со служебными командировками, работникам других работодателей определяются коллективным договором или локальным нормативным актом, если иное не установлено настоящим Кодексом, другими федеральными законами и иными нормативными правовыми актами Российской Федерации.
(часть четвертая введена Федеральным законом от 02.04.2014 N 55-ФЗ)"""
revision = "ред. от 25.05.2026"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_34683/20f26d6f52c6bf331795839d40a065b6cb0fb84c/"
retrieved = "2026-11-27"

[[law]]
id = "fz44-1"
short = "44-ФЗ"
act = "Федеральный закон «О контрактной системе в сфере закупок товаров, работ, услуг для обеспечения государственных и муниципальных нужд»"
number = "44-ФЗ"
article = "Статья 1"
title = "Сфера применения настоящего Федерального закона"
text = """1. Настоящий Федеральный закон регулирует отношения, направленные на обеспечение государственных и муниципальных нужд в целях повышения эффективности, результативности осуществления закупок товаров, работ, услуг, обеспечения гласности и прозрачности осуществления таких закупок, предотвращения коррупции и других злоупотреблений в сфере таких закупок, в части, касающейся:
1) планирования закупок товаров, работ, услуг;
2) определения поставщиков (подрядчиков, исполнителей);
3) заключения предусмотренных настоящим Федеральным законом контрактов;
(п. 3 в ред. Федерального закона от 27.12.2019 N 449-ФЗ)
4) особенностей исполнения контрактов;
5) мониторинга закупок товаров, работ, услуг;
6) аудита в сфере закупок товаров, работ, услуг;
7) контроля за соблюдением законодательства Российской Федерации и иных нормативных правовых актов о контрактной системе в сфере закупок товаров, работ, услуг для обеспечения государственных и муниципальных нужд (далее - контроль в сфере закупок).
2. Настоящий Федеральный закон не применяется к отношениям, связанным с:
1) оказанием услуг международными финансовыми организациями, созданными в соответствии с международными договорами, участником которых является Российская Федерация, а также международными финансовыми организациями, с которыми Российская Федерация заключила международные договоры;
2) закупкой товаров, работ, услуг для обеспечения безопасности лиц, подлежащих государственной защите, в соответствии с Федеральным законом от 20 августа 2004 года N 119-ФЗ "О государственной защите потерпевших, свидетелей и иных участников уголовного судопроизводства" и Федеральным законом от 20 апреля 1995 года N 45-ФЗ "О государственной защите судей, должностных лиц правоохранительных и контролирующих органов";
3) закупкой драгоценных металлов и драгоценных камней для пополнения Государственного фонда драгоценных металлов и драгоценных камней Российской Федерации и государственных фондов драгоценных металлов и драгоценных камней соответствующих субъектов Российской Федерации, на территориях которых были добыты драгоценные металлы и драгоценные камни;
(п. 3 введен Федеральным законом от 28.12.2013 N 396-ФЗ; в ред. Федерального закона от 23.06.2016 N 203-ФЗ)
4) назначением адвоката органом дознания, органом предварительного следствия, судом для участия в качестве защитника в уголовном судопроизводстве в соответствии с Уголовно-процессуальным кодексом Российской Федерации либо судом для участия в качестве представителя в гражданском судопроизводстве в соответствии с Гражданским процессуальным кодексом Российской Федерации или в административном судопроизводстве в соответствии с Кодексом административного судопроизводства Российской Федерации;
(п. 4 введен Федеральным законом от 28.12.2013 N 396-ФЗ, в ред. Федерального закона от 08.03.2015 N 23-ФЗ)
5) привлечением адвоката к оказанию гражданам юридической помощи бесплатно в соответствии с Федеральным законом от 21 ноября 2011 года N 324-ФЗ "О бесплатной юридической помощи в Российской Федерации";
(п. 5 введен Федеральным законом от 28.12.2013 N 396-ФЗ)
6) закупкой товаров, работ, услуг участковыми избирательными комиссиями, территориальными избирательными комиссиями, в том числе при возложении на них полномочий иной избирательной комиссии, окружными избирательными комиссиями во исполнение полномочий, предусмотренных законодательством Российской Федерации о выборах и референдумах;
(п. 6 введен Федеральным законом от 04.06.2014 N 140-ФЗ; в ред. Федеральных законов от 27.02.2020 N 27-ФЗ, от 14.11.2023 N 531-ФЗ, от 08.08.2024 N 318-ФЗ)
7) привлечением избирательными комиссиями, комиссиями референдума граждан к выполнению работ и оказанию услуг, связанных с обеспечением полномочий избирательных комиссий, комиссий референдума в период подготовки и проведения выборов, референдума, по гражданско-правовым договорам, заключаемым с физическими лицами, в соответствии с Федеральным законом от 12 июня 2002 года N 67-ФЗ "Об основных гарантиях избирательных прав и права на участие в референдуме граждан Российской Федерации";
(п. 7 введен Федеральным законом от 09.03.2016 N 66-ФЗ; в ред. Федеральных законов от 27.02.2020 N 27-ФЗ, от 08.08.2024 N 318-ФЗ)
8) не применяется с 31 июля 2018 года. - Федеральный закон от 03.07.2016 N 266-ФЗ; утратил силу. - Федеральный закон от 08.08.2024 N 318-ФЗ;
9) закупкой товаров, работ, услуг Центральной избирательной комиссией Российской Федерации, избирательными комиссиями субъектов Российской Федерации, в том числе при возложении на них полномочий окружной избирательной комиссии, при подготовке и проведении выборов в органы государственной власти;
(п. 9 введен Федеральным законом от 28.12.2016 N 474-ФЗ; в ред. Федеральных законов от 27.02.2020 N 27-ФЗ, от 29.05.2023 N 184-ФЗ, от 08.08.2024 N 318-ФЗ)
9.1) закупкой товаров, работ, услуг избирательными комиссиями субъектов Российской Федерации, территориальными избирательными комиссиями, осуществляемой за счет средств, выделенных из бюджетов субъектов Российской Федерации, бюджета федеральной территории на оказание содействия в подготовке и проведении выборов в федеральные органы государственной власти;
(п. 9.1 введен Федеральным законом от 14.11.2023 N 531-ФЗ)
10) взиманием оператором электронной площадки, оператором специализированной электронной площадки платы в соответствии с частью 4 статьи 24.1 настоящего Федерального закона;
(п. 10 введен Федеральным законом от 31.12.2017 N 504-ФЗ)
11) заключением соглашения об установлении сервитута в случаях и порядке, которые предусмотрены земельным законодательством;
(п. 11 введен Федеральным законом от 27.12.2019 N 449-ФЗ)
12) оплатой судебных издержек (издержек) в случаях и в порядке, предусмотренных Арбитражным процессуальным кодексом Российской Федерации, Гражданским процессуальным кодексом Российской Федерации, Кодексом административного судопроизводства Российской Федерации, Уголовно-процессуальным кодексом Российской Федерации.
(п. 12 введен Федеральным законом от 02.07.2021 N 360-ФЗ)
3. Особенности регулирования отношений, указанных в части 1 настоящей статьи, в случаях, предусмотренных настоящим Федеральным законом, могут быть установлены отдельными федеральными законами.
(часть 3 в ред. Федерального закона от 28.12.2013 N 396-ФЗ)"""
revision = "ред. от 04.08.2026"
