[[law]]
id = "fz54-1.2"
short = "54-ФЗ"
act = "Федеральный закон «О применении контрольно-кассовой техники при осуществлении расчётов в Российской Федерации»"
number = "54-ФЗ"
article = "Статья 1.2"
title = "Сфера и правила применения контрольно-кассовой техники"
text = """(введена Федеральным законом от 03.07.2016 N 290-ФЗ)
1. Контрольно-кассовая техника, включенная в реестр контрольно-кассовой техники, применяется на территории Российской Федерации в обязательном порядке всеми организациями и индивидуальными предпринимателями при осуществлении ими расчетов, за исключением случаев, установленных настоящим Федеральным законом.
(в ред. Федерального закона от 03.07.2018 N 192-ФЗ)
2. При осуществлении расчета пользователь обязан выдать кассовый чек или бланк строгой отчетности на бумажном носителе и (или) в случае предоставления покупателем (клиентом) пользователю до момента расчета абонентского номера либо адреса электронной почты направить кассовый чек или бланк строгой отчетности в электронной форме покупателю (клиенту) на предоставленные абонентский номер либо адрес электронной почты (при наличии технической возможности для передачи информации покупателю (клиенту) в электронной форме на адрес электронной почты), если иное не установлено настоящим Федеральным законом.
(в ред. Федерального закона от 03.07.2018 N 192-ФЗ)
В случаях, указанных в пункте 7 статьи 2 настоящего Федерального закона, пользователь обязан выдать покупателю (клиенту) кассовый чек или бланк строгой отчетности на бумажном носителе без его направления покупателю (клиенту) в электронной форме.
(в ред. Федерального закона от 03.07.2018 N 192-ФЗ)
2.1. При осуществлении расчетов в виде зачета или возврата предварительной оплаты и (или) авансов, ранее внесенных физическими лицами за услуги в сфере культурно-массовых мероприятий, услуги перевозки пассажиров, багажа, грузов и грузобагажа, услуги связи, услуги в электронной форме, определенные статьей 174.2 Налогового кодекса Российской Федерации, услуги в сфере жилищно-коммунального хозяйства (включая услуги ресурсоснабжающих организаций), услуги охраны и систем обеспечения безопасности, услуги в сфере образования, а также за иные услуги, определенные Правительством Российской Федерации, пользователем может быть сформирован один кассовый чек (бланк строгой отчетности), содержащий сведения о всех таких расчетах, совершенных за расчетный период, не превышающий календарного месяца или установленный законодательством Российской Федерации (но не позднее десяти календарных дней, следующих за днем окончания расчетного периода), без выдачи (направления) кассового чека (бланка строгой отчетности) клиенту.
(в ред. Федерального закона от 06.06.2019 N 129-ФЗ)
При осуществлении указанных в пунктах 5 и 5.3 настоящей статьи расчетов в виде зачета или возврата предварительной оплаты и (или) авансов, ранее внесенных физическими лицами в полном объеме, пользователи вправе направлять кассовые чеки (бланки строгой отчетности) покупателям (клиентам) в электронной форме без выдачи бумажных кассовых чеков (бланков строгой отчетности).
(п. 2.1 введен Федеральным законом от 03.07.2018 N 192-ФЗ)
2.2. Действие положений настоящего Федерального закона об обязанности пользователя применять контрольно-кассовую технику при осуществлении расчетов в безналичном порядке с предъявлением электронного средства платежа распространяется в том числе на расчеты путем перевода денежных средств с использованием сервиса быстрых платежей платежной системы Банка России, включая расчеты с применением автоматического устройства для расчетов.
(п. 2.2 введен Федеральным законом от 08.08.2024 N 274-ФЗ)
2.3. Действие положений настоящего Федерального закона о применении пользователем контрольно-кассовой техники при осуществлении расчетов распространяется также на расчеты, осуществляемые с участием работника, уполномоченного пользователем на осуществление расчетов с покупателями (клиентами) и применение контрольно-кассовой техники при осуществлении расчетов, а также осуществляемые пользователем с применением автоматического устройства для расчетов, если иное не предусмотрено настоящим Федеральным законом.
(п. 2.3 введен Федеральным законом от 08.08.2024 N 274-ФЗ)
3. Пользователь в целях исполнения обязанности, указанной в пункте 2 настоящей статьи, вправе:
1) в случае согласия покупателя (клиента) на получение кассового чека (бланка строгой отчетности) в электронной форме с использованием информационного ресурса, размещенного в сети "Интернет", который обеспечивает возможность покупателю (клиенту) бесплатно получить кассовый чек (бланк строгой отчетности) на основании сведений о регистрационном номере контрольно-кассовой техники, сумме, дате и времени расчета, фискальном признаке документа, которые позволяют идентифицировать такой кассовый чек (бланк строгой отчетности), и предоставления покупателем (клиентом) пользователю до совершения расчета абонентского номера либо адреса электронной почты, на которые могут быть направлены сведения, идентифицирующие кассовый чек (бланк строгой отчетности), направить покупателю (клиенту) на абонентский номер либо адрес электронной почты в момент расчета такие сведения, идентифицирующие кассовый чек (бланк строгой отчетности) и адрес информационного ресурса;
2) в случае согласия покупателя (клиента) на получение кассового чека (бланка строгой отчетности) в электронной форме с использованием информационного ресурса уполномоченного органа, обеспечивающего возможность покупателю (клиенту) получить кассовый чек (бланк строгой отчетности) на основании используемых им абонентского номера либо адреса электронной почты, и предоставления покупателем (клиентом) пользователю до совершения расчета абонентского номера либо адреса электронной почты, которые используются покупателем (клиентом) для получения кассовых чеков (бланков строгой отчетности) с использованием указанного информационного ресурса уполномоченного органа, включить в состав кассового чека (бланка строгой отчетности) абонентский номер либо адрес электронной почты, предоставленные покупателем (клиентом), и направить кассовый чек (бланк строгой отчетности) в момент расчета в уполномоченный орган через оператора фискальных данных.
(п. 3 в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
3.1. В случае, если обязанность по предоставлению кассового чека (бланка строгой отчетности) обеспечивается путем отражения QR-кода, который позволяет покупателю (клиенту) осуществить его считывание и идентифицировать кассовый чек (бланк строгой отчетности) и структура данных которого включает в себя дату и время осуществления расчета, порядковый номер фискального документа, признак расчета, сумму расчета, заводской номер фискального накопителя, фискальный признак документа (далее - QR-код), на дисплее компьютерного устройства пользователя или печати такого QR-кода на бланке документа в случаях, предусмотренных настоящим Федеральным законом, получение кассового чека (бланка строгой отчетности) в электронной форме с реквизитами, предусмотренными статьей 4.7 настоящего Федерального закона, осуществляется покупателем (клиентом) самостоятельно с использованием информационного сервиса уполномоченного органа, порядок использования которого определяется уполномоченным органом, или официального программного средства уполномоченного органа для мобильного телефона, смартфона или иного компьютерного устройства (далее - мобильное приложение уполномоченного органа) путем считывания указанного QR-кода с использованием мобильного телефона, смартфона или иного компьютерного устройства покупателя (клиента), который обеспечивает доступ покупателя (клиента) к такому информационному сервису уполномоченного органа или указанному мобильному приложению уполномоченного органа.
Кассовый чек (бланк строгой отчетности), полученный покупателем (клиентом) в соответствии с настоящим пунктом, в том числе распечатанный им на бумажном носителе, приравнивается к кассовому чеку (бланку строгой отчетности), полученному на бумажном носителе или в электронной форме.
Предоставление кассового чека (бланка строгой отчетности) в соответствии с настоящим пунктом осуществляется на безвозмездной основе.
(п. 3.1 введен Федеральным законом от 06.06.2019 N 129-ФЗ)
4. Кассовый чек или бланк строгой отчетности, полученные покупателем (клиентом) в электронной форме и распечатанные им на бумажном носителе, приравниваются к кассовому чеку или бланку строгой отчетности, отпечатанным контрольно-кассовой техникой на бумажном носителе, при условии, что сведения, указанные в таком кассовом чеке или таком бланке строгой отчетности, идентичны направленным покупателю (клиенту) в электронной форме кассовому чеку или бланку строгой отчетности.
5. Пользователи при осуществлении расчетов в безналичном порядке, исключающих возможность непосредственного взаимодействия покупателя (клиента) с пользователем или уполномоченным им лицом либо автоматическим устройством для расчетов, с применением устройств, подключенных к сети "Интернет" и обеспечивающих возможность дистанционного взаимодействия покупателя (клиента) с пользователем или уполномоченным им лицом либо автоматическим устройством для расчетов (далее - расчеты в безналичном порядке в сети "Интернет"), обязаны обеспечить передачу покупателю (клиенту) кассового чека или бланка строгой отчетности в электронной форме на абонентский номер либо адрес электронной почты, указанные покупателем (клиентом) до совершения расчетов. При этом кассовый чек или бланк строгой отчетности на бумажном носителе пользователем может не печататься.
(в ред. Федерального закона от 03.07.2018 N 192-ФЗ)
5.1. Пользователь при осуществлении расчетов (за исключением расчетов в безналичном порядке в сети "Интернет") вправе не выдавать кассовый чек или бланк строгой отчетности на бумажном носителе и в случае непредоставления покупателем (клиентом) пользователю до момента расчета абонентского номера либо адреса электронной почты не направлять кассовый чек или бланк строгой отчетности в электронной форме покупателю (клиенту) на абонентский номер либо адрес электронной почты, а также вправе применять контрольно-кассовую технику (за исключением контрольно-кассовой техники, применяемой в режиме, не предусматривающем обязательной передачи фискальных документов в налоговые органы в электронной форме через оператора фискальных данных) вне корпуса автоматического устройства для расчетов в случаях:
1) осуществления расчетов с использованием электронных средств платежа с применением автоматических устройств для расчетов при оказании услуг по перевозке пассажиров, багажа, грузов и грузобагажа;
2) осуществления расчетов за реализуемый товар (кроме подакцизной продукции, за исключением сахаросодержащих напитков, указанных в подпункте 23 пункта 1 статьи 181 Налогового кодекса Российской Федерации, технически сложных товаров) с использованием автоматических устройств для расчетов, содержащих внутри своего корпуса оборудование для осуществления выдачи данного товара, а также осуществления расчетов с использованием автоматических устройств для расчетов за оказание услуг автоматическими устройствами, механически соединенными с корпусом автоматического устройства для расчетов, при условии отображения при осуществлении расчетов, указанных в настоящем подпункте, на дисплее автоматического устройства для расчетов QR-кода.
(в ред. Федеральных законов от 06.06.2019 N 129-ФЗ, от 21.11.2022 N 443-ФЗ, от 29.12.2022 N 597-ФЗ)
(п. 5.1 введен Федеральным законом от 03.07.2018 N 192-ФЗ)
5.2. Положения пункта 5.1 настоящей статьи, касающиеся условий применения пользователями контрольно-кассовой техники, применяются в случае наличия на корпусе автоматического устройства для расчетов легко читаемого заводского номера такого автоматического устройства для расчетов, нанесенного в месте, доступном для осмотра без перемещения и (или) разборки автоматического устройства для расчетов.
(п. 5.2 введен Федеральным законом от 03.07.2018 N 192-ФЗ)
5.3. Пользователи при осуществлении расчетов в безналичном порядке, исключающих возможность непосредственного взаимодействия покупателя (клиента) с пользователем или уполномоченным им лицом либо автоматическим устройством для расчетов и не подпадающих под действие положений пунктов 5 и 5.1 настоящей статьи, обязаны сформировать кассовый чек (бланк строгой отчетности) не позднее рабочего дня, следующего за днем осуществления расчета, и передать его покупателю (клиенту) одним из следующих способов:
(в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
1) в электронной форме на абонентский номер или адрес электронной почты, предоставленные покупателем (клиентом) пользователю, не позднее рабочего дня, следующего за днем осуществления расчета, но не позднее момента передачи товара (результата работы, оказанной услуги), за исключением случаев расчета за товар (работу, услугу) после указанного момента;
(в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
2) на бумажном носителе вместе с товаром в случае расчетов за товар без направления покупателю такого кассового чека (бланка строгой отчетности) в электронной форме;
3) на бумажном носителе при первом непосредственном взаимодействии клиента с пользователем или уполномоченным им лицом в случае расчетов за работы и услуги без направления клиенту такого кассового чека (бланка строгой отчетности) в электронной форме.
(п. 5.3 введен Федеральным законом от 03.07.2018 N 192-ФЗ)
5.4. При осуществлении расчетов пользователь обязан обеспечить возможность покупателю (клиенту) предоставлять пользователю до момента осуществления расчета абонентский номер и (или) адрес электронной почты, которые используются покупателем (клиентом) для получения кассового чека (бланка строгой отчетности) в электронной форме, либо сведения о том, что абонентский номер и (или) адрес электронной почты, ранее предоставленные покупателем (клиентом) пользователю, не используются им для получения кассовых чеков (бланков строгой отчетности) в электронной форме.
(п. 5.4 в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
5.5. Банковские платежные агенты (субагенты), осуществляющие свою деятельность в соответствии с Федеральным законом от 27 июня 2011 года N 161-ФЗ "О национальной платежной системе", при осуществлении расчетов с использованием автоматических устройств для расчетов обязаны выдать кассовый чек на бумажном носителе и (или) направить покупателю (клиенту) кассовый чек в электронной форме на предоставленные абонентский номер либо адрес электронной почты (при наличии технической возможности для передачи информации покупателю (клиенту) в электронной форме на адрес электронной почты) или сведения в электронной форме, идентифицирующие такой кассовый чек (регистрационный номер контрольно-кассовой техники, сумма, дата и время расчета, фискальный признак документа), и информацию об адресе информационного ресурса, который размещен в сети "Интернет" и по которому такой кассовый чек может быть бесплатно получен покупателем (клиентом).
(п. 5.5 введен Федеральным законом от 03.07.2018 N 192-ФЗ)
5.6. Пользователи вправе применять контрольно-кассовую технику (за исключением контрольно-кассовой техники, применяемой в режиме, не предусматривающем обязательной передачи фискальных документов в налоговые органы в электронной форме через оператора фискальных данных), расположенную вне места совершения расчетов, в следующих случаях:
1) при осуществлении расчетов (за исключением расчетов в безналичном порядке в сети "Интернет") за реализуемый товар при разносной торговле и при дистанционном способе продажи товаров (кроме случаев, указанных в пункте 5.1 настоящей статьи);
2) при осуществлении расчетов по месту выполнения работы и (или) оказания услуги, которые выполняются (оказываются) пользователем вне торгового объекта, торгового места, здания, строения, сооружения и их частей и (или) земельного участка, используемых пользователем для выполнения работ и (или) оказания услуг на правах собственности, аренды или иных законных основаниях;
3) при осуществлении расчетов в случаях, предусмотренных пунктами 5.8 - 5.10 настоящей статьи.
(п. 5.6 введен Федеральным законом от 06.06.2019 N 129-ФЗ)
5.7. В случаях, предусмотренных пунктом 5.6 настоящей статьи, обязанность по выдаче (направлению) покупателю (клиенту) кассового чека (бланка строгой отчетности) помимо способов, указанных в пункте 2 настоящей статьи, может быть исполнена пользователем одним из следующих способов:
1) путем направления покупателю (клиенту) в момент расчета на абонентский номер либо адрес электронной почты (при наличии технической возможности для передачи информации покупателю (клиенту) в электронной форме на адрес электронной почты), предоставленные покупателем (клиентом) пользователю до совершения расчета, сведений в электронной форме, позволяющих идентифицировать такой кассовый чек (бланк строгой отчетности) (регистрационный номер контрольно-кассовой техники, сумма, дата и время расчета, фискальный признак документа), и информации об адресе информационного ресурса, который размещен в сети "Интернет" и по которому такой кассовый чек (бланк строгой отчетности) может быть бесплатно получен покупателем (клиентом);
2) путем обеспечения покупателю (клиенту) возможности в момент расчета считать с дисплея мобильного телефона, смартфона или иного компьютерного устройства QR-код.
(п. 5.7 введен Федеральным законом от 06.06.2019 N 129-ФЗ)
5.8. В случае, если в соответствии с законодательством Российской Федерации федеральные органы исполнительной власти наделены полномочиями по утверждению форм бланков документов, используемых при оказании услуг населению, и (или) законодательство Российской Федерации предусматривает использование соответствующих бланков документов при оказании услуг населению, обязанность пользователя по выдаче (направлению) клиенту кассового чека (бланка строгой отчетности) помимо способов, указанных в пункте 2 настоящей статьи, может быть исполнена пользователем путем передачи клиенту указанного документа на бумажном носителе с содержащимися на нем реквизитами кассового чека (бланка строгой отчетности), позволяющими идентифицировать этот кассовый чек (бланк строгой отчетности) (QR-код и (или) дату и время осуществления расчета, порядковый номер фискального документа, признак расчета, сумму расчета, заводской номер фискального накопителя и фискальный признак документа).
(п. 5.8 введен Федеральным законом от 06.06.2019 N 129-ФЗ)
5.9. При осуществлении расчетов водителем или кондуктором в салоне транспортного средства при реализации проездных документов (билетов) и талонов для проезда в общественном транспорте обязанность по направлению покупателю (клиенту) кассового чека (бланка строгой отчетности) помимо способов, указанных в пунктах 2, 3, 5.7 и 5.8 настоящей статьи, может быть исполнена пользователем путем предоставления покупателю (клиенту) указанных документов (билетов) и талонов на бумажном носителе с указанием сведений, достаточных для идентификации и бесплатного получения покупателем (клиентом) с использованием информационных ресурсов оператора фискальных данных и (или) налогового органа, размещенных в сети "Интернет", кассового чека (бланка строгой отчетности) в электронной форме, который должен быть сформирован в день осуществления расчета.
(п. 5.9 введен Федеральным законом от 06.06.2019 N 129-ФЗ)
5.10. В случаях осуществления расчетов (за исключением расчетов наличными деньгами, а также расчетов с предъявлением электронного средства платежа при условии непосредственного взаимодействия клиента с пользователем) при приеме платы за жилое помещение и коммунальные услуги обязанность по применению контрольно-кассовой техники, в том числе по формированию кассового чека (бланка строгой отчетности) и передаче всех фискальных данных в виде фискальных документов, сформированных с применением контрольно-кассовой техники, в налоговые органы в электронной форме через оператора фискальных данных, исполняется пользователем в срок, не превышающий пяти рабочих дней со дня поступления денежных средств на расчетный счет пользователя.
Обязанность по выдаче (направлению) клиенту кассового чека (бланка строгой отчетности) при осуществлении расчетов, указанных в настоящем пункте, исполняется путем выдачи (направления) клиенту пользователем бесплатно по его письменному запросу на бумажном носителе или в электронной форме, содержащему наименование услуги, дату и сумму расчета, в срок, не превышающий пяти рабочих дней со дня получения такого запроса. Такой запрос должен быть передан (направлен) клиентом пользователю не позднее трех месяцев со дня формирования соответствующего кассового чека (бланка строгой отчетности). При отсутствии такого запроса по истечении указанного срока обязанность пользователя по выдаче (направлению) клиенту кассового чека (бланка строгой отчетности) считается исполненной.
(п. 5.10 введен Федеральным законом от 06.06.2019 N 129-ФЗ)
5.11. При расчетах за оказание услуг общественного питания, осуществляемых при непосредственном взаимодействии клиента с пользователем или автоматическим устройством для расчетов, пользователь после получения согласия клиента совершить такой расчет должен отпечатать кассовый чек (бланк строгой отчетности) на бумажном носителе и выдать его клиенту до момента расчета. При таких расчетах кассовый чек (бланк строгой отчетности) подтверждает предстоящий прием денежных средств за оказание услуг общественного питания.
(п. 5.11 введен Федеральным законом от 08.08.2024 N 274-ФЗ)
6. Пользователи обязаны обеспечить передачу в момент расчета всех фискальных данных в виде фискальных документов, сформированных с применением контрольно-кассовой техники (кроме документов, указанных в пункте 4.1 статьи 4.1 настоящего Федерального закона), в налоговые органы через оператора фискальных данных с учетом положений абзаца третьего настоящего пункта, за исключением случаев, указанных в пункте 7 статьи 2 настоящего Федерального закона.
(в ред. Федеральных законов от 03.07.2018 N 192-ФЗ, от 26.07.2019 N 238-ФЗ)
Все полученные оператором фискальных данных фискальные документы (кроме документов, указанных в пункте 4.1 статьи 4.1 настоящего Федерального закона) записываются и сохраняются оператором фискальных данных в некорректируемом виде в базе фискальных данных.
(в ред. Федерального закона от 26.07.2019 N 238-ФЗ)
При передаче фискальных документов в электронной форме оператору фискальных данных могут не передаваться реквизиты кассового чека или бланка строгой отчетности, установленные абзацами пятым, шестым, шестнадцатым, восемнадцатым пункта 1 статьи 4.7 настоящего Федерального закона, а также сведения о заводском номере автоматического устройства для расчетов при условии, что такие данные были переданы оператору фискальных данных ранее в составе отчета о регистрации или отчета об изменении параметров регистрации.
6.1. Пользователи, которые осуществляют расчеты за товары, маркированные средствами идентификации (далее - маркированные товары), и которые в соответствии с законодательством Российской Федерации должны направлять (вносить) информацию о таких товарах в государственную информационную систему мониторинга за оборотом товаров, подлежащих обязательной маркировке средствами идентификации, или федеральную государственную информационную систему мониторинга движения лекарственных препаратов для медицинского применения от производителя до конечного потребителя с использованием в отношении лекарственных препаратов для медицинского применения средств идентификации (далее - информационные системы маркировки), в момент расчета за такие товары обязаны формировать данные о таких товарах, предусмотренные законодательством Российской Федерации о применении контрольно-кассовой техники, в виде запросов о коде маркировки (за исключением случаев, предусмотренных пунктом 3.2 статьи 4.3 настоящего Федерального закона) и уведомлений о реализации маркированного товара в электронной форме с использованием контрольно-кассовой техники, обеспечивающей возможность формирования указанных данных и их передачу с использованием этой контрольно-кассовой техники оператору информационных систем маркировки через оператора фискальных данных, за исключением случаев, предусмотренных пунктом 7 статьи 2 и пунктом 2.1 статьи 5 настоящего Федерального закона.
(в ред. Федерального закона от 29.12.2022 N 597-ФЗ)
Пользователи, которые указаны в абзаце первом настоящего пункта и осуществляют расчеты за маркированные товары, в случаях, предусмотренных пунктом 7 статьи 2 настоящего Федерального закона, обязаны осуществлять проверку достоверности кодов маркировки таких товаров с использованием контрольно-кассовой техники, содержащей фискальный накопитель, обеспечивающий самостоятельную проверку достоверности кодов маркировки, по их коду проверки в случае, если код маркировки содержит код проверки, который может быть самостоятельно проверен фискальным накопителем с использованием ключа проверки кода проверки, за исключением случаев, предусмотренных пунктом 2.1 статьи 5 настоящего Федерального закона.
(п. 6.1 введен Федеральным законом от 26.07.2019 N 238-ФЗ)
7. Пользователи, заключившие договор с оператором фискальных данных, у которого впоследствии было аннулировано разрешение на обработку фискальных данных, с даты прекращения действия такого разрешения до момента заключения договора с новым оператором фискальных данных вправе применять контрольно-кассовую технику без передачи фискальных документов в налоговые органы и оператору информационных систем маркировки (если пользователь осуществлял расчеты за маркированные товары) в электронной форме через оператора фискальных данных, но не более чем в течение 20 календарных дней. При этом контрольно-кассовая техника не может применяться в режиме, не предусматривающем обязательной передачи фискальных документов в налоговые органы и оператору информационных систем маркировки (если пользователь осуществлял расчеты за маркированные товары) в электронной форме через оператора фискальных данных, а при заключении договора с новым оператором фискальных данных пользователи обязаны передать в налоговые органы и оператору информационных систем маркировки (если пользователь осуществлял расчеты за маркированные товары) в электронной форме через оператора фискальных данных все фискальные документы, которые не были переданы.
(в ред. Федерального закона от 26.07.2019 N 238-ФЗ)
8. В случае принятия нормативного правового акта, которым вносятся изменения в требования к контрольно-кассовой технике и (или) фискальному накопителю:
контрольно-кассовая техника и фискальный накопитель, которые соответствуют требованиям, действовавшим до дня вступления в силу указанного нормативного правового акта, и которые не соответствуют требованиям, измененным указанным нормативным правовым актом, могут быть включены в реестр контрольно-кассовой техники и реестр фискальных накопителей в течение одного года со дня вступления в силу указанного нормативного правового акта. Такие контрольно-кассовая техника и фискальный накопитель, которые включены в реестр контрольно-кассовой техники и реестр фискальных накопителей, не подлежат исключению из реестра контрольно-кассовой техники и реестра фискальных накопителей в связи с их несоответствием требованиям, измененным указанным нормативным правовым актом в течение двух лет со дня вступления в силу указанного нормативного правового акта;
контрольно-кассовая техника и фискальный накопитель, которые включены в реестр контрольно-кассовой техники и реестр фискальных накопителей, соответствуют требованиям, действовавшим до дня вступления в силу указанного нормативного правового акта, и не соответствуют требованиям, измененным указанным нормативным правовым актом, могут регистрироваться, перерегистрироваться, применяться пользователями и не подлежат исключению из реестра контрольно-кассовой техники и реестра фискальных накопителей в связи с их несоответствием указанному нормативному правовому акту в течение двух лет со дня вступления в силу указанного нормативного правового акта. В случае, если в течение двух лет со дня принятия указанного нормативного правового акта контрольно-кассовая техника и фискальный накопитель не приведены в соответствие с требованиями, измененными указанным нормативным правовым актом, такие контрольно-кассовая техника и фискальный накопитель подлежат исключению соответственно из реестра контрольно-кассовой техники и реестра фискальных накопителей, за исключением случая, предусмотренного пунктом 8.1 настоящей статьи.
(п. 8 в ред. Федерального закона от 26.07.2019 N 238-ФЗ)
8.1. Фискальный накопитель контрольно-кассовой техники, зарегистрированной в налоговых органах с этим фискальным накопителем в установленном порядке, может применяться пользователем в такой контрольно-кассовой технике до окончания срока действия его ключей фискального признака.
(п. 8.1 введен Федеральным законом от 26.07.2019 N 238-ФЗ)
9. Федеральный орган исполнительной власти, осуществляющий функции по выработке государственной политики и нормативно-правовому регулированию в сфере применения контрольно-кассовой техники, определяется Правительством Российской Федерации.
Указанный в абзаце первом настоящего пункта федеральный орган исполнительной власти дает письменные разъяснения налоговым органам, организациям, индивидуальным предпринимателям и физическим лицам по вопросам применения законодательства Российской Федерации о применении контрольно-кассовой техники.
(абзац введен Федеральным законом от 03.07.2018 N 192-ФЗ)"""
