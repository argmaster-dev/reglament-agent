[[law]]
id = "fz54-1.1"
short = "54-ФЗ"
act = "Федеральный закон «О применении контрольно-кассовой техники при осуществлении расчётов в Российской Федерации»"
number = "54-ФЗ"
article = "Статья 1.1"
title = "Основные понятия, используемые в настоящем Федеральном законе"
text = """(введена Федеральным законом от 03.07.2016 N 290-ФЗ)
Для целей настоящего Федерального закона используются следующие основные понятия:
автоматизированная система для бланков строгой отчетности - контрольно-кассовая техника, используемая для формирования в электронной форме бланков строгой отчетности, а также их печати на бумажных носителях;
автоматическое устройство для расчетов - устройство для осуществления расчета с покупателем (клиентом) в автоматическом режиме без участия уполномоченного лица организации или индивидуального предпринимателя;
(в ред. Федерального закона от 03.07.2018 N 192-ФЗ)
база фискальных данных - совокупность фискальных данных, поступивших от пользователей к оператору фискальных данных, в том числе в виде фискальных документов, подлежащих хранению и защите от доступа третьих лиц;
бенефициарный владелец - физическое лицо, которое в конечном счете прямо или косвенно (через третьих лиц) владеет (имеет преобладающее участие более 25 процентов в капитале) организацией либо имеет возможность контролировать действия организации и (или) ее руководителя, главного бухгалтера, члена коллегиального исполнительного органа или учредителя. Бенефициарным владельцем руководителя, главного бухгалтера, члена коллегиального исполнительного органа или учредителя организации считается это лицо, за исключением случаев, если имеются основания полагать, что бенефициарным владельцем является иное физическое лицо;
(абзац введен Федеральным законом от 03.07.2018 N 192-ФЗ)
бланк строгой отчетности - первичный учетный документ, приравненный к кассовому чеку, соответствующий требованиям законодательства Российской Федерации о применении контрольно-кассовой техники, сформированный в электронной форме и (или) отпечатанный с применением автоматизированной системы для бланков строгой отчетности в момент расчета между пользователем и клиентом за оказанные услуги, содержащий сведения о расчете и подтверждающий факт его осуществления, за исключением случаев, предусмотренных настоящим Федеральным законом;
(в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
версия модели контрольно-кассовой техники - модель контрольно-кассовой техники, имеющая уникальный для своего наименования номер версии, присвоенный ее изготовителем;
(абзац введен Федеральным законом от 03.07.2018 N 192-ФЗ)
выгодоприобретатель - лицо, которое не является непосредственно руководителем, главным бухгалтером, членом коллегиального исполнительного органа или учредителем организации, к выгоде которого действуют указанные лица при проведении операций с денежными средствами и иным имуществом организации;
(абзац введен Федеральным законом от 03.07.2018 N 192-ФЗ)
заводской номер - уникальный номер экземпляра модели контрольно-кассовой техники, фискального накопителя, средства формирования фискального признака, средства проверки фискального признака, автоматического устройства для расчетов, присвоенный изготовителем;
изготовитель - организация, осуществляющая производство контрольно-кассовой техники и (или) фискальных накопителей, средств формирования фискального признака, средств проверки фискального признака;
кабинет контрольно-кассовой техники - информационный ресурс, который размещен на официальном сайте федерального органа исполнительной власти, уполномоченного по контролю и надзору за применением контрольно-кассовой техники (далее - уполномоченный орган), в информационно-телекоммуникационной сети "Интернет" (далее - сеть "Интернет"), ведение которого осуществляется уполномоченным органом в установленном им порядке и который используется организациями, индивидуальными предпринимателями и налоговыми органами для реализации своих прав и обязанностей, установленных законодательством Российской Федерации о применении контрольно-кассовой техники;
кассовый чек - первичный учетный документ, соответствующий требованиям законодательства Российской Федерации о применении контрольно-кассовой техники, сформированный в электронной форме и (или) отпечатанный с применением контрольно-кассовой техники в момент расчета между пользователем и покупателем (клиентом), содержащий сведения о расчете и подтверждающий факт его осуществления, за исключением случаев, предусмотренных настоящим Федеральным законом;
(в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
ключ фискального признака - ключевой документ, предназначенный для формирования фискального признака и созданный с использованием мастер-ключа;
код идентификации - последовательность символов, представляющая собой уникальный номер экземпляра товара;
(абзац введен Федеральным законом от 26.07.2019 N 238-ФЗ)
код маркировки - уникальная последовательность символов, состоящая из кода идентификации и кода проверки;
(абзац введен Федеральным законом от 26.07.2019 N 238-ФЗ)
код проверки - последовательность символов, сформированная в результате криптографического преобразования кода идентификации и позволяющая выявить фальсификацию кода идентификации при его проверке с использованием фискального накопителя и (или) технических средств проверки кода проверки;
(абзац введен Федеральным законом от 26.07.2019 N 238-ФЗ)
контрольно-кассовая техника - электронные вычислительные машины, иные компьютерные устройства и их комплексы, обеспечивающие запись и хранение фискальных данных в фискальных накопителях, формирующие фискальные документы, обеспечивающие передачу фискальных документов в налоговые органы через оператора фискальных данных и печать фискальных документов на бумажных носителях в соответствии с правилами, установленными законодательством Российской Федерации о применении контрольно-кассовой техники;
мастер-ключ - ключевой документ, предназначенный для создания серии ключей фискального признака, а также проверки фискальных признаков, сформированных с использованием ключей фискального признака этой серии;
модель контрольно-кассовой техники (фискального накопителя) - вид (тип) контрольно-кассовой техники (фискального накопителя), соответствующий требованиям законодательства Российской Федерации о применении контрольно-кассовой техники и имеющий уникальное наименование, присвоенное изготовителем;
обработка фискальных данных - любое действие (любая операция) или совокупность действий (операций), совершаемых оператором фискальных данных с применением технических средств оператора фискальных данных при формировании и (или) использовании базы фискальных данных, включая получение, проверку достоверности, сбор, запись, систематизацию, накопление, хранение в некорректируемом виде, извлечение, использование, передачу в адрес налоговых органов в виде фискальных документов, предоставление налоговым органам таких данных и доступа к ним;
оператор информационных систем маркировки - лицо, являющееся оператором государственной информационной системы мониторинга за оборотом товаров, подлежащих обязательной маркировке средствами идентификации, и оператором федеральной государственной информационной системы мониторинга движения лекарственных препаратов для медицинского применения от производителя до конечного потребителя с использованием в отношении лекарственных препаратов для медицинского применения средств идентификации;
(абзац введен Федеральным законом от 26.07.2019 N 238-ФЗ)
оператор фискальных данных - организация, созданная в соответствии с законодательством Российской Федерации, находящаяся на территории Российской Федерации, получившая в соответствии с законодательством Российской Федерации о применении контрольно-кассовой техники разрешение на обработку фискальных данных;
перерегистрация контрольно-кассовой техники - внесение налоговым органом изменений в сведения, предоставленные пользователем при регистрации контрольно-кассовой техники (за исключением идентификационного номера налогоплательщика и заводского номера контрольно-кассовой техники) и внесенные в журнал учета контрольно-кассовой техники и карточку регистрации контрольно-кассовой техники, и предоставление новой карточки регистрации контрольно-кассовой техники на бумажном носителе или в виде электронного документа, подписанного усиленной квалифицированной электронной подписью, без присвоения налоговым органом контрольно-кассовой технике нового регистрационного номера;
пользователь - организация или индивидуальный предприниматель, применяющие контрольно-кассовую технику при осуществлении расчетов;
применение контрольно-кассовой техники - совокупность действий организации или индивидуального предпринимателя с использованием контрольно-кассовой техники, включенной в реестр контрольно-кассовой техники, зарегистрированной в порядке, установленном настоящим Федеральным законом, и используемой по адресу и месту ее установки (применения), указанным при регистрации (перерегистрации), по формированию фискальных данных и фискальных документов, их записи и хранению в фискальном накопителе, сведения о котором представлены в налоговые органы при регистрации либо перерегистрации контрольно-кассовой техники, а также передаче фискальных документов оператору фискальных данных либо в налоговые органы в случаях, установленных законодательством Российской Федерации о применении контрольно-кассовой техники;
(абзац введен Федеральным законом от 26.07.2019 N 238-ФЗ; в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
расчеты - прием (получение) и выплата денежных средств наличными деньгами и (или) в безналичном порядке за товары, работы, услуги, прием ставок, интерактивных ставок и выплата денежных средств в виде выигрыша при осуществлении деятельности по организации и проведению азартных игр, выдача (получение) обменных знаков игорного заведения и выдача (получение) денежных средств в обмен на предъявленные обменные знаки игорного заведения, а также прием денежных средств при реализации лотерейных билетов, электронных лотерейных билетов, приеме лотерейных ставок и выплате денежных средств в виде выигрыша при осуществлении деятельности по организации и проведению лотерей. В целях настоящего Федерального закона под расчетами понимаются также прием (получение) банковскими платежными агентами (субагентами), осуществляющими свою деятельность в соответствии с Федеральным законом от 27 июня 2011 года N 161-ФЗ "О национальной платежной системе", от юридического лица, индивидуального предпринимателя, физического лица, не являющегося индивидуальным предпринимателем, наличных денежных средств, в том числе для зачисления сумм принятых наличных денежных средств на банковские счета таких лиц, прием (получение) и выплата денежных средств в виде предварительной оплаты и (или) авансов, зачет и возврат предварительной оплаты и (или) авансов, предоставление и погашение займов для оплаты товаров, работ, услуг (включая осуществление ломбардами кредитования граждан под залог принадлежащих гражданам вещей и деятельности по хранению вещей) либо предоставление или получение иного встречного предоставления за товары, работы, услуги;
(в ред. Федеральных законов от 03.07.2018 N 192-ФЗ, от 01.10.2020 N 313-ФЗ, от 06.03.2022 N 35-ФЗ)
регистрация контрольно-кассовой техники - внесение налоговым органом записи об экземпляре модели контрольно-кассовой техники, ее фискального накопителя и о пользователе в журнал учета контрольно-кассовой техники, присвоение налоговым органом контрольно-кассовой технике регистрационного номера и выдача пользователю карточки регистрации контрольно-кассовой техники с указанием ее регистрационного номера на бумажном носителе или в электронном документе, подписанном усиленной квалифицированной электронной подписью;
реестр контрольно-кассовой техники - совокупность сведений о каждом изготовленном экземпляре модели контрольно-кассовой техники;
реестр фискальных накопителей - совокупность сведений о каждом изготовленном экземпляре модели фискального накопителя, который пользователи вправе использовать при применении контрольно-кассовой техники;
снятие контрольно-кассовой техники с регистрационного учета - внесение налоговым органом в журнал учета контрольно-кассовой техники сведений о прекращении применения пользователем контрольно-кассовой техники и выдача пользователю карточки о снятии контрольно-кассовой техники с регистрационного учета;
средство идентификации - код маркировки в машиночитаемой форме, представленный в виде штрихового кода, или записанный на радиочастотную метку, или представленный с использованием иного средства (технологии) автоматической идентификации;
(абзац введен Федеральным законом от 26.07.2019 N 238-ФЗ)
средство проверки фискального признака - программно-аппаратное шифровальное (криптографическое) средство защиты фискальных данных, обеспечивающее возможность выявления корректировки или фальсификации фискальных данных, защищенных фискальным признаком, в результате их проверки с использованием мастер-ключа;
средство формирования фискального признака - программно-аппаратное шифровальное (криптографическое) средство защиты фискальных данных, обеспечивающее возможность формирования фискального признака;
технические средства оператора фискальных данных - аппаратные, программные и программно-аппаратные средства, используемые оператором фискальных данных при обработке фискальных данных, в том числе средства формирования фискального признака и средства проверки фискального признака;
фискальные данные - сведения о расчетах, в том числе сведения об организации или индивидуальном предпринимателе, осуществляющих расчеты, о контрольно-кассовой технике, применяемой при осуществлении расчетов, и иные сведения, сформированные контрольно-кассовой техникой или оператором фискальных данных;
фискальный документ - фискальные данные, представленные по установленным форматам в виде кассового чека, бланка строгой отчетности и (или) иного документа, предусмотренного законодательством Российской Федерации о применении контрольно-кассовой техники, на бумажном носителе и (или) в электронной форме, в том числе защищенные фискальным признаком;
фискальный накопитель - программно-аппаратное шифровальное (криптографическое) средство защиты фискальных данных в опломбированном корпусе, содержащее ключи фискального признака, обеспечивающее возможность формирования фискальных признаков, запись фискальных данных в некорректируемом виде (с фискальными признаками), их энергонезависимое долговременное хранение, проверку фискальных признаков, расшифровывание и аутентификацию фискальных документов, подтверждающих факт получения оператором фискальных данных фискальных документов, переданных контрольно-кассовой техникой, направляемых в контрольно-кассовую технику оператором фискальных данных (далее - подтверждение оператора), а также обеспечивающее возможность шифрования фискальных документов в целях обеспечения конфиденциальности информации, передаваемой оператору фискальных данных, и выполнение иных функций, предусмотренных законодательством Российской Федерации о применении контрольно-кассовой техники;
(в ред. Федерального закона от 26.07.2019 N 238-ФЗ)
фискальный признак - достоверная информация, сформированная с использованием фискального накопителя и ключа фискального признака или с использованием средств формирования фискального признака и мастер-ключа в результате криптографического преобразования фискальных данных, наличие которой дает возможность выявления корректировки или фальсификации этих фискальных данных при их проверке с использованием фискального накопителя и (или) средства проверки фискального признака;
фискальный признак документа - фискальный признак, формируемый с использованием фискального накопителя для проверки достоверности фискальных данных, защищенных фискальным признаком, с использованием средств проверки фискального признака, используемых уполномоченным органом;
фискальный признак оператора - фискальный признак, формируемый с использованием средств формирования фискального признака оператора фискальных данных для проверки достоверности фискальных данных, защищенных фискальным признаком, с использованием средств проверки фискального признака, используемых уполномоченным органом;
фискальный признак подтверждения - фискальный признак, формируемый с использованием средств формирования фискального признака оператора фискальных данных для проверки достоверности фискальных данных, защищенных фискальным признаком, с использованием фискального накопителя;
фискальный признак сообщения - фискальный признак, формируемый с использованием фискального накопителя для проверки достоверности фискальных данных, защищенных фискальным признаком, с использованием средств проверки фискального признака оператора фискальных данных;
эксперт - физическое лицо, являющееся работником экспертной организации и получившее дополнительное профессиональное образование в области оценки соответствия контрольно-кассовой техники, фискальных накопителей и технических средств оператора фискальных данных требованиям законодательства Российской Федерации о применении контрольно-кассовой техники;
(в ред. Федерального закона от 08.08.2024 N 274-ФЗ)
экспертная организация - организация, самостоятельно выполняющая функции по организации и проведению экспертизы моделей контрольно-кассовой техники, моделей фискальных накопителей и технических средств оператора фискальных данных (соискателя разрешения на обработку фискальных данных) и включенная в реестр экспертных организаций, соответствующих требованиям законодательства Российской Федерации о применении контрольно-кассовой техники.
(в ред. Федерального закона от 08.08.2024 N 274-ФЗ)"""
