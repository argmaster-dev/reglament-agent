[[law]]
id = "fz187-7"
short = "187-ФЗ"
act = "Федеральный закон «О безопасности критической информационной инфраструктуры Российской Федерации»"
number = "187-ФЗ"
article = "Статья 7"
title = "Категорирование объектов критической информационной инфраструктуры"
text = """1. Категорирование объекта критической информационной инфраструктуры представляет собой установление соответствия объекта критической информационной инфраструктуры критериям значимости и показателям их значений, присвоение ему одной из категорий значимости, проверку сведений о результатах ее присвоения.
2. Категорирование осуществляется исходя из:
1) социальной значимости, выражающейся в оценке возможного ущерба, причиняемого жизни или здоровью людей, возможности прекращения или нарушения функционирования объектов обеспечения жизнедеятельности населения, транспортной инфраструктуры, сетей связи, а также максимальном времени отсутствия доступа к государственной услуге для получателей такой услуги;
2) политической значимости, выражающейся в оценке возможного причинения ущерба интересам Российской Федерации в вопросах внутренней и внешней политики;
3) экономической значимости, выражающейся в оценке возможного причинения прямого и косвенного ущерба субъектам критической информационной инфраструктуры и (или) бюджетам Российской Федерации;
4) экологической значимости, выражающейся в оценке уровня воздействия на окружающую среду;
5) значимости объекта критической информационной инфраструктуры для обеспечения обороны страны, безопасности государства и правопорядка.
3. Устанавливаются три категории значимости объектов критической информационной инфраструктуры - первая, вторая и третья.
4. Субъекты критической информационной инфраструктуры в соответствии с критериями значимости и показателями их значений, порядком осуществления категорирования, перечнями типовых отраслевых объектов критической информационной инфраструктуры и отраслевыми особенностями категорирования объектов критической информационной инфраструктуры присваивают одну из категорий значимости принадлежащим им на праве собственности, аренды или ином законном основании объектам критической информационной инфраструктуры. Если объект критической информационной инфраструктуры не соответствует критериям значимости, показателям этих критериев и их значениям, ему не присваивается ни одна из таких категорий.
(в ред. Федерального закона от 07.04.2025 N 58-ФЗ)
5. Сведения о результатах присвоения объекту критической информационной инфраструктуры одной из категорий значимости либо об отсутствии необходимости присвоения ему одной из таких категорий субъекты критической информационной инфраструктуры в письменном виде в десятидневный срок со дня принятия ими соответствующего решения направляют в федеральный орган исполнительной власти, уполномоченный в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, по утвержденной им форме.
6. Федеральный орган исполнительной власти, уполномоченный в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, в тридцатидневный срок со дня получения сведений, указанных в части 5 настоящей статьи, проверяет соблюдение порядка осуществления категорирования с учетом перечней типовых отраслевых объектов критической информационной инфраструктуры, отраслевых особенностей категорирования объектов критической информационной инфраструктуры и правильность присвоения объекту критической информационной инфраструктуры одной из категорий значимости.
(часть 6 в ред. Федерального закона от 07.04.2025 N 58-ФЗ)
7. В случае, если субъектом критической информационной инфраструктуры соблюден порядок осуществления категорирования с учетом перечней типовых отраслевых объектов критической информационной инфраструктуры, отраслевых особенностей категорирования объектов критической информационной инфраструктуры и принадлежащему ему на праве собственности, аренды или ином законном основании объекту критической информационной инфраструктуры правильно присвоена одна из категорий значимости, федеральный орган исполнительной власти, уполномоченный в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, вносит сведения о таком объекте критической информационной инфраструктуры в реестр значимых объектов критической информационной инфраструктуры, о чем в десятидневный срок уведомляется субъект критической информационной инфраструктуры.
(в ред. Федерального закона от 07.04.2025 N 58-ФЗ)
8. В случае, если федеральным органом исполнительной власти, уполномоченным в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, выявлены нарушения порядка осуществления категорирования с учетом перечней типовых отраслевых объектов критической информационной инфраструктуры, отраслевых особенностей категорирования объектов критической информационной инфраструктуры, федеральный орган исполнительной власти, уполномоченный в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, возвращает представленные сведения субъекту критической информационной инфраструктуры в письменном виде с мотивированным обоснованием причин их возврата.
(часть 8 в ред. Федерального закона от 07.04.2025 N 58-ФЗ)
9. Субъект критической информационной инфраструктуры после получения мотивированного обоснования причин возврата сведений, указанных в части 5 настоящей статьи, не более чем в десятидневный срок устраняет отмеченные недостатки и повторно направляет такие сведения в федеральный орган исполнительной власти, уполномоченный в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации.
10. Сведения об отсутствии необходимости присвоения объекту критической информационной инфраструктуры одной из категорий значимости после их проверки направляются федеральным органом исполнительной власти, уполномоченным в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, в государственную систему обнаружения, предупреждения и ликвидации последствий компьютерных атак на информационные ресурсы Российской Федерации, о чем в десятидневный срок уведомляется субъект критической информационной инфраструктуры.
11. В случае непредставления субъектом критической информационной инфраструктуры сведений, указанных в части 5 настоящей статьи, федеральный орган исполнительной власти, уполномоченный в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, направляет в адрес указанного субъекта требование о необходимости соблюдения положений настоящей статьи с указанием срока выполнения данного требования.
(в ред. Федерального закона от 07.04.2025 N 58-ФЗ)
12. Категория значимости, к которой отнесен значимый объект критической информационной инфраструктуры, может быть изменена в порядке, предусмотренном для категорирования, в следующих случаях:
1) по мотивированному решению федерального органа исполнительной власти, уполномоченного в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, принятому по результатам проверки, проведенной в рамках осуществления государственного контроля в области обеспечения безопасности значимых объектов критической информационной инфраструктуры;
2) в случае изменения значимого объекта критической информационной инфраструктуры, в результате которого такой объект перестал соответствовать критериям значимости и показателям их значений, отраслевым особенностям категорирования объектов критической информационной инфраструктуры, на основании которых ему была присвоена определенная категория значимости;
(в ред. Федерального закона от 07.04.2025 N 58-ФЗ)
3) в связи с ликвидацией, реорганизацией субъекта критической информационной инфраструктуры и (или) изменением его организационно-правовой формы, в результате которых были изменены либо утрачены признаки субъекта критической информационной инфраструктуры.
13. В перечни типовых отраслевых объектов критической информационной инфраструктуры включаются только типы информационных систем, информационно-телекоммуникационных сетей, автоматизированных систем управления, обладающие признаком значимости.
(часть 13 введена Федеральным законом от 07.04.2025 N 58-ФЗ)
14. Перечни типовых отраслевых объектов критической информационной инфраструктуры подлежат пересмотру и дополнению на основании предложений федерального органа исполнительной власти, уполномоченного в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации, или федерального органа исполнительной власти, уполномоченного в области обеспечения функционирования государственной системы обнаружения, предупреждения и ликвидации последствий компьютерных атак на информационные ресурсы Российской Федерации.
(часть 14 введена Федеральным законом от 07.04.2025 N 58-ФЗ)"""
revision = "ред. от 07.04.2025"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_220885/507db218cf421e2e2fbcaaf66cb113f59fc164c9/"
retrieved = "2026-11-27"

[[law]]
id = "fz402-9"
short = "402-ФЗ"
act = "Федеральный закон «О бухгалтерском учёте»"
number = "402-ФЗ"
article = "Статья 9"
title = "Первичные учетные документы"
text = """1. Каждый факт хозяйственной жизни подлежит оформлению первичным учетным документом. Не допускается принятие к бухгалтерскому учету документов, которыми оформляются не имевшие места факты хозяйственной жизни, в том числе лежащие в основе мнимых и притворных сделок.
(в ред. Федерального закона от 21.12.2013 N 357-ФЗ)
2. Обязательными реквизитами первичного учетного документа являются:
1) наименование документа;
2) дата составления документа;
3) наименование экономического субъекта, составившего документ;
4) содержание факта хозяйственной жизни;
5) величина натурального и (или) денежного измерения факта хозяйственной жизни с указанием единиц измерения;
6) наименование должности лица (лиц), совершившего (совершивших) сделку, операцию и ответственного (ответственных) за ее оформление, либо наименование должности лица (лиц), ответственного (ответственных) за оформление свершившегося события;
(в ред. Федерального закона от 21.12.2013 N 357-ФЗ)
7) подписи лиц, предусмотренных пунктом 6 настоящей части, с указанием их фамилий и инициалов либо иных реквизитов, необходимых для идентификации этих лиц.
3. Первичный учетный документ должен быть составлен при совершении факта хозяйственной жизни, а если это не представляется возможным - непосредственно после его окончания. Лицо, ответственное за оформление факта хозяйственной жизни, обеспечивает своевременную передачу первичных учетных документов для регистрации содержащихся в них данных в регистрах бухгалтерского учета, а также достоверность этих данных. Лицо, на которое возложено ведение бухгалтерского учета, и лицо, с которым заключен договор об оказании услуг по ведению бухгалтерского учета, не несут ответственность за соответствие составленных другими лицами первичных учетных документов свершившимся фактам хозяйственной жизни. Требования в письменной форме главного бухгалтера, иного должностного лица, на которое возложено ведение бухгалтерского учета, либо лица, с которым заключен договор об оказании услуг по ведению бухгалтерского учета, в отношении соблюдения установленного порядка документального оформления фактов хозяйственной жизни, представления документов (сведений), необходимых для ведения бухгалтерского учета, должностному лицу, на которое возложено ведение бухгалтерского учета, либо лицу, с которым заключен договор об оказании услуг по ведению бухгалтерского учета, обязательны для всех работников экономического субъекта.
(в ред. Федеральных законов от 21.12.2013 N 357-ФЗ, от 26.07.2019 N 247-ФЗ)
4. Формы первичных учетных документов определяет руководитель экономического субъекта по представлению должностного лица, на которое возложено ведение бухгалтерского учета. Формы первичных учетных документов для организаций бюджетной сферы устанавливаются в соответствии с бюджетным законодательством Российской Федерации.
(в ред. Федеральных законов от 21.12.2013 N 357-ФЗ, от 26.07.2019 N 247-ФЗ)
5. Первичный учетный документ составляется на бумажном носителе и (или) в виде электронного документа, подписанного электронной подписью.
6. В случае, если законодательством Российской Федерации или договором предусмотрено представление первичного учетного документа другому лицу или в государственный орган на бумажном носителе, экономический субъект обязан по требованию другого лица или государственного органа за свой счет изготавливать на бумажном носителе копии первичного учетного документа, составленного в виде электронного документа.
7. В первичном учетном документе допускаются исправления, если иное не установлено федеральными законами или нормативными правовыми актами органов государственного регулирования бухгалтерского учета. Исправление в первичном учетном документе должно содержать дату исправления, а также подписи лиц, составивших документ, в котором произведено исправление, с указанием их фамилий и инициалов либо иных реквизитов, необходимых для идентификации этих лиц.
8. В случае, если в соответствии с законодательством Российской Федерации первичные учетные документы, в том числе в виде электронного документа, изымаются, копии изъятых документов, изготовленные в порядке, установленном законодательством Российской Федерации, включаются в документы бухгалтерского учета."""
revision = "ред. от 15.12.2025"
source_url = "https://www.consultant.ru/document/cons_doc_LAW_122855/b24121ba7152f33673608559f2ca844ef5b6a74c/"
retrieved = "2026-11-27"

[[law]]
id = "fz99-12"
short = "99-ФЗ"
act = "Федеральный закон «О лицензировании отдельных видов деятельности»"
number = "99-ФЗ"
article = "Статья 12"
title = "Перечень видов деятельности, на которые требуются лицензии"
text = """1. В соответствии с настоящим Федеральным законом лицензированию подлежат следующие виды деятельности:
1) разработка, производство, распространение шифровальных (криптографических) средств, информационных систем и телекоммуникационных систем, защищенных с использованием шифровальных (криптографических) средств, выполнение работ, оказание услуг в области шифрования информации, техническое обслуживание шифровальных (криптографических) средств, информационных систем и телекоммуникационных систем, защищенных с использованием шифровальных (криптографических) средств (за исключением случая, если техническое обслуживание шифровальных (криптографических) средств, информационных систем и телекоммуникационных систем, защищенных с использованием шифровальных (криптографических) средств, осуществляется для обеспечения собственных нужд юридического лица или индивидуального предпринимателя);
2) разработка, производство, реализация и приобретение в целях продажи специальных технических средств, предназначенных для негласного получения информации;
3) деятельность по выявлению электронных устройств, предназначенных для негласного получения информации (за исключением случая, если указанная деятельность осуществляется для обеспечения собственных нужд юридического лица или индивидуального предпринимателя);
4) разработка и производство средств защиты конфиденциальной информации;
5) деятельность по технической защите конфиденциальной информации;
6) производство и реализация защищенной от подделок полиграфической продукции (за исключением избирательных бюллетеней, бюллетеней для голосования на референдумах, иной избирательной документации, документации референдума);
(в ред. Федерального закона от 23.05.2025 N 115-ФЗ)
7) разработка, производство, испытание и ремонт авиационной техники, за исключением беспилотных авиационных систем и (или) их элементов, включающих беспилотные гражданские воздушные суда с максимальной взлетной массой 30 килограммов и менее;
(в ред. Федерального закона от 02.07.2021 N 349-ФЗ)
8) разработка, производство, испытание, установка, монтаж, техническое обслуживание, ремонт, утилизация и реализация вооружения и военной техники, разработка, производство, испытание, хранение, реализация и утилизация боеприпасов (за исключением указанной деятельности, осуществляемой воинскими частями и организациями Вооруженных Сил Российской Федерации и войск национальной гвардии Российской Федерации, в случае, если осуществление указанной деятельности предусмотрено их учредительными документами);
(п. 8 в ред. Федерального закона от 30.12.2021 N 490-ФЗ)
9) разработка, производство, испытание, ремонт и утилизация гражданского и служебного оружия и основных частей огнестрельного оружия, разработка, производство, испытание, утилизация патронов к гражданскому и служебному оружию и составных частей патронов (за исключением указанной деятельности, осуществляемой воинскими частями и организациями Вооруженных Сил Российской Федерации и войск национальной гвардии Российской Федерации, в случае, если осуществление указанной деятельности предусмотрено их учредительными документами);
(п. 9 в ред. Федерального закона от 30.12.2021 N 490-ФЗ)
9.1) хранение и торговля гражданским и служебным оружием и основными частями огнестрельного оружия, патронами к гражданскому и служебному оружию и составными частями патронов (за исключением указанной деятельности, осуществляемой воинскими частями и организациями Вооруженных Сил Российской Федерации и войск национальной гвардии Российской Федерации, в случае, если осуществление указанной деятельности предусмотрено их учредительными документами);
(п. 9.1 в ред. Федерального закона от 30.12.2021 N 490-ФЗ)
10) разработка, производство, испытание, хранение, реализация (в том числе распространение), утилизация пиротехнических изделий IV и V классов в соответствии с национальным стандартом, применение пиротехнических изделий IV и V классов в соответствии с техническим регламентом (за исключением указанной деятельности, осуществляемой воинскими частями и организациями Вооруженных Сил Российской Федерации и войск национальной гвардии Российской Федерации, в случае, если осуществление указанной деятельности предусмотрено их учредительными документами);
(п. 10 в ред. Федерального закона от 30.12.2021 N 490-ФЗ)
11) деятельность по хранению и уничтожению химического оружия;
12) эксплуатация взрывопожароопасных и химически опасных производственных объектов I, II и III классов опасности. В целях настоящего Федерального закона лицензирование не осуществляется в отношении деятельности по эксплуатации взрывопожароопасных и химически опасных производственных объектов I, II и III классов опасности, осуществляемой на объектах (в организациях) федеральных органов исполнительной власти в области обороны, обеспечения безопасности, государственной охраны, внешней разведки, мобилизационной подготовки и мобилизации, исполнения наказаний;
(п. 12 в ред. Федерального закона от 25.12.2023 N 637-ФЗ)
13) утратил силу с 1 июля 2013 года. - Федеральный закон от 04.03.2013 N 22-ФЗ;
14) деятельность по тушению пожаров в населенных пунктах, на производственных объектах и объектах инфраструктуры;
(п. 14 в ред. Федерального закона от 14.10.2014 N 307-ФЗ)
15) деятельность по монтажу, техническому обслуживанию и ремонту средств обеспечения пожарной безопасности зданий и сооружений;
16) производство лекарственных средств;
