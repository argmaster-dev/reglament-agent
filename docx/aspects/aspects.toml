# Каталог «На что обратить внимание». Рубрики — по разделам регламентов; аспекты — со ссылками на статьи законов (laws.toml).
# short — фраза для чата; text — полный совет для панели; quote — дословный фрагмент статьи, подтверждающий совет.

[[rubric]]
id = "presale"
title = "Пресейл, ТКП и конкурсные заявки"
sections = ["td-project:1", "td-project:2", "td-project:3", "td-project:5", "td-project:6", "dbrct-project:1", "dbrct-project:2", "dbrct-project:3", "dbrct-project:5", "dbrct-project:6", "ib-presale:1", "ib-presale:2", "ib-presale:3", "ib-presale:5", "ib-presale:6", "ib-presale:7", "ib-presale:8", "ib-presale:13", "ib-presale:14", "ib-presale:15", "ib-presale:16"]

  [[rubric.aspect]]
  id = "offer"
  when = ["ткп", "оферт", "коммерческ", "кп ", "цен", "стоимост"]
  short = "ТКП с конкретными условиями может быть признано офертой, а оферта связывает вас с момента её получения заказчиком."
  text = "Проверьте, не может ли ТКП с конкретными условиями быть признано офертой: оферта связывает направившее её лицо с момента получения адресатом. Если вы не хотите связывать себя договором, прямо укажите в ТКП, что это не оферта; предложение, адресованное неопределённому кругу лиц, рассматривается как приглашение делать оферты, если иное прямо не указано в предложении."
  laws = ["gk-435", "gk-437"]
  quote = "Офертой признается адресованное одному или нескольким конкретным лицам предложение, которое достаточно определенно и выражает намерение лица, сделавшего предложение, считать себя заключившим договор с адресатом, которым будет принято предложение. … Оферта связывает направившее ее лицо с момента ее получения адресатом. … Реклама и иные предложения, адресованные неопределенному кругу лиц, рассматриваются как приглашение делать оферты, если иное прямо не указано в предложении."

  [[rubric.aspect]]
  id = "public-procurement"
  when = ["гос", "тендер", "конкурс", "аукцион", "закупк", "44-фз", "223-фз", "бюджетн"]
  short = "Если заказчик государственный или его закупки подпадают под 223-ФЗ, порядок закупки регулируют 44-ФЗ или 223-ФЗ, а не только регламент."
  text = "Если заказчик — государственный или муниципальный заказчик либо организация, закупки которой регулирует 223-ФЗ (например, государственная корпорация, государственная компания, автономное учреждение, общество с публичным участием в капитале; в отдельных случаях — бюджетное учреждение), проверьте, не определяют ли порядок закупки отдельные законы и документация закупки, а не только внутренний регламент."
  laws = ["fz44-1", "fz223-1"]
  quote = "Настоящий Федеральный закон регулирует отношения, направленные на обеспечение государственных и муниципальных нужд в целях повышения эффективности, результативности осуществления закупок товаров, работ, услуг, обеспечения гласности и прозрачности осуществления таких закупок, предотвращения коррупции и других злоупотреблений в сфере таких закупок, в части, касающейся: … Настоящий Федеральный закон устанавливает общие принципы закупки товаров, работ, услуг и основные требования к закупке товаров, работ, услуг: … 1) государственными корпорациями, государственными компаниями, публично-правовыми компаниями, субъектами естественных монополий, организациями, осуществляющими регулируемые виды деятельности в сфере электроснабжения, газоснабжения, теплоснабжения, водоснабжения, водоотведения, очистки сточных вод, обращения с твердыми коммунальными отходами, автономными учреждениями, а также хозяйственными обществами, в уставном капитале которых доля участия Российской Федерации, субъекта Российской Федерации, муниципального образования в совокупности превышает пятьдесят процентов;"

[[rubric]]
id = "customer-contract"
title = "Договор с заказчиком"
sections = ["td-project:7", "dbrct-project:8", "ib-project:8"]

  [[rubric.aspect]]
  id = "public-procurement-contract"
  when = ["гос", "тендер", "конкурс", "аукцион", "закупк", "44-фз", "223-фз", "бюджетн"]
  short = "Если заказчик государственный, заключение контракта регулирует 44-ФЗ; закупки госкомпаний и ряда других организаций — 223-ФЗ."
  text = "Если заказчик — государственный или муниципальный заказчик либо организация, закупки которой регулирует 223-ФЗ (например, государственная корпорация, государственная компания, автономное учреждение, общество с публичным участием в капитале; в отдельных случаях — бюджетное учреждение), проверьте, не определяют ли порядок закупки отдельные законы и документация закупки, а не только внутренний регламент."
  laws = ["fz44-1", "fz223-1"]
  quote = "Настоящий Федеральный закон регулирует отношения, направленные на обеспечение государственных и муниципальных нужд в целях повышения эффективности, результативности осуществления закупок товаров, работ, услуг, обеспечения гласности и прозрачности осуществления таких закупок, предотвращения коррупции и других злоупотреблений в сфере таких закупок, в части, касающейся: … Настоящий Федеральный закон устанавливает общие принципы закупки товаров, работ, услуг и основные требования к закупке товаров, работ, услуг: … 1) государственными корпорациями, государственными компаниями, публично-правовыми компаниями, субъектами естественных монополий, организациями, осуществляющими регулируемые виды деятельности в сфере электроснабжения, газоснабжения, теплоснабжения, водоснабжения, водоотведения, очистки сточных вод, обращения с твердыми коммунальными отходами, автономными учреждениями, а также хозяйственными обществами, в уставном капитале которых доля участия Российской Федерации, субъекта Российской Федерации, муниципального образования в совокупности превышает пятьдесят процентов; … 3) заключения предусмотренных настоящим Федеральным законом контрактов;"

  [[rubric.aspect]]
  id = "contract-type"
  short = "Договор заключён, только когда согласованы все существенные условия, включая предмет; подряд и услуги — разные виды договоров."
  text = "Проверьте, к какому виду относится договор: по договору подряда исполнитель выполняет определённую работу и сдаёт её результат, по договору возмездного оказания услуг — совершает определённые действия или осуществляет определённую деятельность. Договор считается заключённым, когда достигнуто соглашение по всем существенным условиям; существенными являются условие о предмете договора и условия, названные в законе как существенные для договоров данного вида."
  laws = ["gk-432", "gk-702", "gk-779"]
  quote = "По договору подряда одна сторона (подрядчик) обязуется выполнить по заданию другой стороны (заказчика) определенную работу и сдать ее результат заказчику, а заказчик обязуется принять результат работы и оплатить его. … По договору возмездного оказания услуг исполнитель обязуется по заданию заказчика оказать услуги (совершить определенные действия или осуществить определенную деятельность), а заказчик обязуется оплатить эти услуги. … Договор считается заключенным, если между сторонами, в требуемой в подлежащих случаях форме, достигнуто соглашение по всем существенным условиям договора. … Существенными являются условия о предмете договора, условия, которые названы в законе или иных правовых актах как существенные или необходимые для договоров данного вида, а также все те условия, относительно которых по заявлению одной из сторон должно быть достигнуто соглашение."

  [[rubric.aspect]]
  id = "trade-secret"
  when = ["nda", "конфиденциальн", "коммерческ тайн", "соглашение о неразглашении"]
  short = "Коммерческая тайна защищена, только если установлен её режим, в том числе условия в договоре с контрагентом."
  text = "Обратите внимание: режим коммерческой тайны считается установленным только после того, как обладатель информации принял меры по охране её конфиденциальности, среди которых — регулирование отношений по использованию такой информации контрагентами на основании гражданско-правовых договоров. Проверьте, установлен ли такой режим и закреплены ли условия обращения с информацией в договоре с заказчиком."
  laws = ["fz98-10"]
  quote = "2. Режим коммерческой тайны считается установленным после принятия обладателем информации, составляющей коммерческую тайну, мер, указанных в части 1 настоящей статьи. … 4) регулирование отношений по использованию информации, составляющей коммерческую тайну, работниками на основании трудовых договоров и контрагентами на основании гражданско-правовых договоров;"

[[rubric]]
id = "start-before-contract"
title = "Старт работ"
sections = ["td-project:8", "dbrct-project:7", "ib-project:9", "ib-project:15", "dbrct-project:8"]

  [[rubric.aspect]]
  id = "no-contract-risk"
  when = ["без договор", "гарантийн", "до подписан", "до заключен"]
  short = "Договор считается заключённым только после согласования всех существенных условий, включая предмет."
  text = "Прежде чем начинать работы, проверьте, согласованы ли существенные условия договора, в том числе предмет: договор считается заключённым только при соглашении по всем существенным условиям. Обратите внимание и на то, что сторона, принявшая исполнение по договору, не вправе требовать признания его незаключённым, если это противоречит принципу добросовестности."
  laws = ["gk-432"]
  quote = "Договор считается заключенным, если между сторонами, в требуемой в подлежащих случаях форме, достигнуто соглашение по всем существенным условиям договора. … Сторона, принявшая от другой стороны полное или частичное исполнение по договору либо иным образом подтвердившая действие договора, не вправе требовать признания этого договора незаключенным, если заявление такого требования с учетом конкретных обстоятельств будет противоречить принципу добросовестности (пункт 3 статьи 1)."

[[rubric]]
id = "subcontract"
title = "Субподрядчики и партнёры"
sections = ["td-project:16", "td-project:23", "dbrct-project:4", "ib-project:14", "ib-project:28", "ib-project:32", "ib-presale:9", "ib-presale:10", "ib-presale:11", "ib-presale:12"]

  [[rubric.aspect]]
  id = "general-contractor"
  when = ["субподряд", "подрядчик", "партнер", "партнёр", "субчик", "субдоговор"]
  short = "Генеральный подрядчик отвечает перед заказчиком за неисполнение обязательств субподрядчиком."
  text = "Обратите внимание: если вы выступаете генеральным подрядчиком и привлекаете субподрядчика, перед заказчиком вы отвечаете за последствия неисполнения или ненадлежащего исполнения обязательств субподрядчиком."
  laws = ["gk-706"]
  quote = "Генеральный подрядчик несет перед заказчиком ответственность за последствия неисполнения или ненадлежащего исполнения обязательств субподрядчиком в соответствии с правилами пункта 1 статьи 313 и статьи 403 настоящего Кодекса, а перед субподрядчиком - ответственность за неисполнение или ненадлежащее исполнение заказчиком обязательств по договору подряда."

  [[rubric.aspect]]
  id = "due-diligence"
  when = ["провер", "контрагент", "выбор", "подбор", "надёжн", "надежн", "благонадёжн", "благонадежн"]
  short = "Для налогового учёта важно, кто фактически исполняет договор: сама сторона сделки или лицо, которому обязательство передано по договору или закону."
  text = "Обратите внимание на условия налогового учёта сделок: уменьшение налоговой базы по сделке допускается, если основной целью сделки не является неуплата налога и обязательство исполнено стороной договора либо лицом, которому оно передано по договору или закону. Проверьте, кто фактически будет исполнять работы по договору с субподрядчиком."
  laws = ["nk-54-1"]
  quote = "1) основной целью совершения сделки (операции) не являются неуплата (неполная уплата) и (или) зачет (возврат) суммы налога; … 2) обязательство по сделке (операции) исполнено лицом, являющимся стороной договора, заключенного с налогоплательщиком, и (или) лицом, которому обязательство по исполнению сделки (операции) передано по договору или закону."

