  [[rubric.aspect]]
  id = "supply-license"
  when = ["лиценз", "софт", "программ", "подписк", "сертификат"]
  short = "Право использования ПО передаётся лицензионным договором; использовать ПО можно только способами, предусмотренными договором."
  text = "Проверьте, как оформлена закупка: оборудование поставляется по договору поставки; если передаётся право использования программы, проверьте лицензионный договор. Лицензиат вправе использовать результат только в пределах прав и способами, предусмотренными договором; в договоре должна быть указана территория использования, а если она не указана — использование допускается на всей территории Российской Федерации."
  laws = ["gk-506", "gk-1235"]
  quote = "По договору поставки поставщик-продавец, осуществляющий предпринимательскую деятельность, обязуется передать в обусловленный срок или сроки производимые или закупаемые им товары покупателю для использования в предпринимательской деятельности или в иных целях, не связанных с личным, семейным, домашним и иным подобным использованием. … Лицензиат может использовать результат интеллектуальной деятельности или средство индивидуализации только в пределах тех прав и теми способами, которые предусмотрены лицензионным договором. … В лицензионном договоре должна быть указана территория, на которой допускается использование результата интеллектуальной деятельности или средства индивидуализации. … 6. Лицензионный договор должен предусматривать:"

[[rubric]]
id = "acceptance"
title = "Сдача-приёмка и закрывающие документы"
sections = ["td-project:21", "dbrct-project:18", "dbrct-project:19", "dbrct-project:20", "ib-project:18", "ib-project:19", "ib-project:28", "ib-project:29"]

  [[rubric.aspect]]
  id = "acceptance-law"
  short = "Если договором не предусмотрено иное, заказчик, принявший работу без проверки, теряет право ссылаться на явные недостатки — заявляйте их при приёмке."
  text = "Обратите внимание на порядок приёмки: заказчик обязан осмотреть и принять выполненную работу в сроки и порядке, предусмотренные договором, а о недостатках заявить немедленно. Если иное не предусмотрено договором, заказчик, принявший работу без проверки, лишается права ссылаться на явные недостатки, а недостатки, оговорённые в акте или ином документе о приёмке, он вправе предъявить позже. Проверьте, что приёмка оформлена документом."
  laws = ["gk-720"]
  quote = "Заказчик обязан в сроки и в порядке, которые предусмотрены договором подряда, с участием подрядчика осмотреть и принять выполненную работу (ее результат), а при обнаружении отступлений от договора, ухудшающих результат работы, или иных недостатков в работе немедленно заявить об этом подрядчику. … Заказчик, обнаруживший недостатки в работе при ее приемке, вправе ссылаться на них в случаях, если в акте либо в ином документе, удостоверяющем приемку, были оговорены эти недостатки либо возможность последующего предъявления требования об их устранении. … Если иное не предусмотрено договором подряда, заказчик, принявший работу без проверки, лишается права ссылаться на недостатки работы, которые могли быть установлены при обычном способе ее приемки (явные недостатки)."

  [[rubric.aspect]]
  id = "primary-documents"
  when = ["упд", "акт", "счет-фактур", "счёт-фактур", "первичн"]
  short = "Каждый факт хозяйственной жизни оформляется первичным документом с обязательными реквизитами."
  text = "Проверьте оформление закрывающих документов: каждый факт хозяйственной жизни подлежит оформлению первичным учётным документом, у которого есть обязательные реквизиты (наименование, дата, наименование составившего лица, содержание факта хозяйственной жизни и др.). Обратите внимание также, что счёт-фактура служит основанием для принятия сумм налога к вычету при выполнении установленных статьёй 169 требований."
  laws = ["fz402-9", "nk-169"]
  quote = "1. Каждый факт хозяйственной жизни подлежит оформлению первичным учетным документом. … 2. Обязательными реквизитами первичного учетного документа являются: … Счета-фактуры являются основанием для принятия предъявленных покупателю продавцом сумм налога к вычету при выполнении требований, установленных пунктами 5, 5.1 и 6 настоящей статьи."

[[rubric]]
id = "payment"
title = "Оплата"
sections = ["td-project:23", "ib-project:31", "ib-project:32"]

  [[rubric.aspect]]
  id = "payment-terms"
  short = "Без условия об авансе работа оплачивается после окончательной сдачи; за просрочку оплаты начисляются проценты или договорная неустойка."
  text = "Проверьте условия оплаты в договоре: если предварительная оплата не предусмотрена, заказчик обязан уплатить цену после окончательной сдачи результатов работы при условии, что работа выполнена надлежащим образом и в согласованный срок; аванса подрядчик вправе требовать только в случаях и в размере, указанных в законе или договоре. За просрочку уплаты денежных средств подлежат уплате проценты на сумму долга, а если договором предусмотрена неустойка, проценты не взыскиваются, если иное не предусмотрено законом или договором."
  laws = ["gk-711", "gk-395"]
  quote = "Если договором подряда не предусмотрена предварительная оплата выполненной работы или отдельных ее этапов, заказчик обязан уплатить подрядчику обусловленную цену после окончательной сдачи результатов работы при условии, что работа выполнена надлежащим образом и в согласованный срок, либо с согласия заказчика досрочно. … Подрядчик вправе требовать выплаты ему аванса либо задатка только в случаях и в размере, указанных в законе или договоре подряда. … В случаях неправомерного удержания денежных средств, уклонения от их возврата, иной просрочки в их уплате подлежат уплате проценты на сумму долга. … В случае, когда соглашением сторон предусмотрена неустойка за неисполнение или ненадлежащее исполнение денежного обязательства, предусмотренные настоящей статьей проценты не подлежат взысканию, если иное не предусмотрено законом или договором."

  [[rubric.aspect]]
  id = "cash-register"
  when = ["картой", "по карте", "карту", "эквайр", "кассов", "ккт", "наличн", "чек ", "чеки", "электронн средств"]
  short = "Безналичные расчёты между организациями — без ККТ, кроме расчётов с предъявлением электронного средства платежа; при наличных и таких расчётах проверьте, нужен ли чек."
  text = "Обратите внимание на контрольно-кассовую технику (ККТ) в расчётах по проекту. Закон устанавливает, что ККТ применяют организации и индивидуальные предприниматели при осуществлении расчётов, за исключением случаев, установленных законом; расчётами считается приём и выплата денежных средств наличными деньгами и (или) в безналичном порядке за товары, работы, услуги. При этом ККТ не применяется при расчётах в безналичном порядке между организациями и (или) индивидуальными предпринимателями, за исключением расчётов с использованием электронного средства платежа с его предъявлением. Поэтому, если по проекту предполагаются наличные расчёты или расчёты с предъявлением электронного средства платежа, проверьте, нужно ли формировать кассовый чек."
  laws = ["fz54-1.2", "fz54-1.1", "fz54-2"]
  quote = "1. Контрольно-кассовая техника, включенная в реестр контрольно-кассовой техники, применяется на территории Российской Федерации в обязательном порядке всеми организациями и индивидуальными предпринимателями при осуществлении ими расчетов, за исключением случаев, установленных настоящим Федеральным законом. … расчеты - прием (получение) и выплата денежных средств наличными деньгами и (или) в безналичном порядке за товары, работы, услуги, … 9. Контрольно-кассовая техника не применяется при осуществлении расчетов в безналичном порядке между организациями и (или) индивидуальными предпринимателями, за исключением осуществляемых ими расчетов с использованием электронного средства платежа с его предъявлением."

[[rubric]]
id = "changes"
title = "Изменения, сроки и риски проекта"
sections = ["td-project:19", "td-project:20", "dbrct-project:16", "dbrct-project:17", "ib-project:20", "ib-project:21", "ib-project:24", "ib-project:26", "td-project:14", "ib-project:13"]

  [[rubric.aspect]]
  id = "change-form"
  when = ["измен", "допсоглаш", "доп соглаш", "дополнительн соглаш", "перенос", "перенест", "сдвиг", "продл", "увелич", "уменьш", "добав", "расшир", "срок договор"]
  short = "Изменение сроков, объёма или цены оформляется соглашением в той же форме, что и договор."
  text = "Если меняются сроки, объём или цена, проверьте, что изменение оформлено соглашением сторон в той же форме, что и договор (если из закона, договора или обычаев не вытекает иное)."
  laws = ["gk-450", "gk-452"]
  quote = "Изменение и расторжение договора возможны по соглашению сторон, если иное не предусмотрено настоящим Кодексом, другими законами или договором. … Соглашение об изменении или о расторжении договора совершается в той же форме, что и договор, если из закона, иных правовых актов, договора или обычаев не вытекает иное."

  [[rubric.aspect]]
  id = "warn-customer"
  when = ["срыв", "задерж", "риск", "невозможн", "препятств"]
  short = "При не зависящих от подрядчика обстоятельствах, грозящих годности результата или срыву срока, подрядчик обязан немедленно предупредить заказчика и приостановить работу."
  text = "Обратите внимание: при обнаружении обстоятельств, которые не зависят от подрядчика и грозят годности или прочности результата либо создают невозможность завершить работу в срок, подрядчик обязан немедленно предупредить заказчика и до получения его указаний приостановить работу. Не предупредивший заказчика подрядчик не вправе ссылаться на эти обстоятельства при предъявлении требований."
  laws = ["gk-716"]
  quote = "Подрядчик обязан немедленно предупредить заказчика и до получения от него указаний приостановить работу при обнаружении: … иных не зависящих от подрядчика обстоятельств, которые грозят годности или прочности результатов выполняемой работы либо создают невозможность ее завершения в срок. … Подрядчик, не предупредивший заказчика об обстоятельствах, указанных в пункте 1 настоящей статьи, либо продолживший работу, не дожидаясь истечения указанного в договоре срока, а при его отсутствии разумного срока для ответа на предупреждение или несмотря на своевременное указание заказчика о прекращении работы, не вправе при предъявлении к нему или им к заказчику соответствующих требований ссылаться на указанные обстоятельства."

[[rubric]]
id = "infosec"
title = "Особенности проектов информационной безопасности"
sections = ["ib-project:1", "ib-project:3", "ib-project:7", "ib-project:8", "ib-project:12", "ib-presale:1", "ib-presale:6", "ib-presale:7"]

  [[rubric.aspect]]
  id = "licensing"
  when = ["лиценз", "фстэк", "фсб", "шифр", "криптограф", "защит"]
  short = "Работы в области шифрования и технической защиты конфиденциальной информации лицензируются — проверьте лицензии у компании и исполнителей."
  text = "Проверьте, не относятся ли работы проекта к лицензируемым видам деятельности: к ним отнесены, в частности, работы и услуги в области шифрования информации, разработка и производство средств защиты конфиденциальной информации и деятельность по технической защите конфиденциальной информации. Уточните наличие необходимых лицензий у компании и у привлекаемых исполнителей."
  laws = ["fz99-12"]
  quote = "В соответствии с настоящим Федеральным законом лицензированию подлежат следующие виды деятельности: … 4) разработка и производство средств защиты конфиденциальной информации; … 5) деятельность по технической защите конфиденциальной информации;"

  [[rubric.aspect]]
  id = "personal-data"
  when = ["персональн", "пдн"]
  short = "При обработке персональных данных нужны правовое основание и меры защиты, а при поручении обработки — договор с условиями поручения."
  text = "Если в проекте обрабатываются персональные данные, проверьте правовое основание обработки (например, согласие субъекта), меры по обеспечению безопасности данных, а при поручении обработки другому лицу — наличие договора, в котором определены условия поручения."
  laws = ["fz152-6", "fz152-19"]
  quote = "Обработка персональных данных допускается в следующих случаях: … 1) обработка персональных данных осуществляется с согласия субъекта персональных данных на обработку его персональных данных; … Оператор вправе поручить обработку персональных данных другому лицу с согласия субъекта персональных данных, если иное не предусмотрено федеральным законом, на основании заключаемого с этим лицом договора, в том числе государственного или муниципального контракта, либо путем принятия государственным органом или муниципальным органом соответствующего акта (далее - поручение оператора). … Оператор при обработке персональных данных обязан принимать необходимые правовые, организационные и технические меры или обеспечивать их принятие для защиты персональных данных"

  [[rubric.aspect]]
  id = "kii"
  when = ["кии", "критическ", "значим объект"]
  short = "Для объектов критической информационной инфраструктуры действует отдельный закон; он предусматривает категорирование объектов по значимости."
  text = "Если объект относится к критической информационной инфраструктуре, обратите внимание на отдельный закон об обеспечении её безопасности; он предусматривает категорирование объектов — установление соответствия критериям значимости и присвоение категории значимости."
  laws = ["fz187-1", "fz187-7"]
  quote = "Настоящий Федеральный закон регулирует отношения в области обеспечения безопасности критической информационной инфраструктуры Российской Федерации … Категорирование объекта критической информационной инфраструктуры представляет собой установление соответствия объекта критической информационной инфраструктуры критериям значимости и показателям их значений, присвоение ему одной из категорий значимости, проверку сведений о результатах ее присвоения."

[[rubric]]
id = "team"
title = "Команда и работа сотрудников"
sections = ["td-project:4", "td-project:9", "td-project:10", "dbrct-project:9", "ib-project:2", "ib-project:5", "td-project:3", "ib-project:7", "ib-project:15"]

  [[rubric.aspect]]
  id = "weekend-work"
  when = ["выходн", "праздн", "сверхурочн", "переработ", "ночь", "ночн"]
  short = "Работа в выходной оформляется письменным распоряжением, как правило с письменного согласия работника, и оплачивается в повышенном размере или компенсируется днём отдыха."
  text = "Если работа планируется в выходные или праздничные дни либо сверх установленной продолжительности рабочего времени, проверьте оформление: привлечение к сверхурочной работе и к работе в выходной или нерабочий праздничный день допускается, как правило, с письменного согласия работника; привлечение к работе в выходные и праздничные дни производится по письменному распоряжению работодателя. Работа в выходной или нерабочий праздничный день оплачивается в повышенном размере либо компенсируется другим днём отдыха по желанию работника."
  laws = ["tk-99", "tk-113", "tk-153"]
  quote = "Работа в выходные и нерабочие праздничные дни запрещается, за исключением случаев, предусмотренных настоящим Кодексом. … Привлечение работников к работе в выходные и нерабочие праздничные дни производится по письменному распоряжению работодателя. … Привлечение работодателем работника к сверхурочной работе допускается с его письменного согласия в следующих случаях: … Оплата в повышенном размере производится всем работникам за часы, фактически отработанные в выходной или нерабочий праздничный день. … По желанию работника, работавшего в выходной или нерабочий праздничный день, ему может быть предоставлен другой день отдыха."

  [[rubric.aspect]]
  id = "business-trip"
  when = ["командиров", "выезд", "на объект", "выезж", "площадк"]
  short = "Командировка — поездка по распоряжению работодателя вне места постоянной работы; расходы возмещаются и должны быть подтверждены документами."
  text = "Проверьте, является ли поездка на объект служебной командировкой: это поездка работника по распоряжению работодателя на определённый срок для выполнения служебного поручения вне места постоянной работы (служебные поездки работников с разъездным характером работы командировками не признаются). Работодатель обязан возмещать расходы по проезду, найму жилья, суточные и иные расходы, произведённые с разрешения или ведома работодателя; для налогового учёта расходы должны быть обоснованными и документально подтверждёнными."
  laws = ["tk-166", "tk-168", "nk-252"]
  quote = "Служебная командировка - поездка работника по распоряжению работодателя на определенный срок для выполнения служебного поручения вне места постоянной работы. … Служебные поездки работников, постоянная работа которых осуществляется в пути или имеет разъездной характер, служебными командировками не признаются. … В случае направления в служебную командировку работодатель обязан возмещать работнику: … Расходами признаются обоснованные и документально подтвержденные затраты (а в случаях, предусмотренных статьей 265 настоящего Кодекса, убытки), осуществленные (понесенные) налогоплательщиком."
