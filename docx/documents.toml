# Карточки исходных документов (ADR-010).
# В самих DOCX нет подразделения и этапа — их задаёт служба качества при загрузке.
# Этот файл используется для первичной загрузки корпуса на стенд.
#
# doc_id     — постоянный идентификатор документа; новая редакция загружается с тем же doc_id
# department — подразделение, к которому относится регламент
# stages     — этапы процесса: "presale" (пресейл), "project" (реализация проекта)

[[document]]
doc_id = "td-project"
file = "Организация проектной деятельности Тех дирекции.docx"
title = "Организация проектной деятельности Технической дирекции"
department = "Техническая дирекция"
stages = ["presale", "project"]

[[document]]
doc_id = "dbrct-project"
file = "Проектная деятельность ДБРЦТ.docx"
title = "Проектная деятельность ДБРЦТ (Департамента бизнес-решений и цифровой трансформации)"
department = "ДБРЦТ"
stages = ["presale", "project"]

[[document]]
doc_id = "ib-project"
file = "Проектная деятельность Дирекции ИБ.docx"
title = "Проектная деятельность Дирекции ИБ"
department = "Дирекция ИБ"
stages = ["project"]

[[document]]
doc_id = "ib-presale"
file = "Пресейловая деятельность Дирекции ИБ.docx"
title = "Пресейловая деятельность Дирекции ИБ"
department = "Дирекция ИБ"
stages = ["presale"]
