services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:018b4a92e634c3a5715f613dd43497e3d8028ae051be7ba6fd127bcffb0e7957
    environment:
      POSTGRES_DB: regulations
      POSTGRES_USER: regulations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${REGULATIONS_DB_PORT:-5432}:5432"
    volumes:
      - regulation_data:/var/lib/postgresql/data
    networks: [backend, local_access]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulations -d regulations"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    networks: [backend, local_access]
    ports:
      - "127.0.0.1:${REGULATIONS_MAIL_PORT:-8026}:8025"
  app:
    build: .
    env_file: [.env]
    environment:
      # Override host-side values from .env: inside the container services are reached by name.
      DATABASE_URL: postgresql://regulations:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/regulations
      MODEL_OLLAMA_URL: http://host.docker.internal:11434
      MODEL_CHAT_SLOTS: ${MODEL_CHAT_SLOTS:-1}
      CHAT_SERVICES_FACTORY: ${CHAT_SERVICES_FACTORY:-reglament_agent.dialog.services:build_services}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:?Set CHAINLIT_AUTH_SECRET}
      CHAT_EXPERT_PASSWORD: ${CHAT_EXPERT_PASSWORD:?Set CHAT_EXPERT_PASSWORD}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, local_access]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped
networks:
  backend:
    internal: true
  # Docker publishes host ports only on a non-internal bridge.
  # Every published port above binds to the host loopback interface.
  local_access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  regulation_data:
